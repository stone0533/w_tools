name: w_tools_example
description: "w_tools 聚合包最小示例：一个 WForm 表单，验证 package:w_tools/w_tools.dart 的真实用法。"
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  w_tools:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# example 始终用 workspace 里的子包：否则子包版本领先 pub.dev 时
# （发版前的正常状态）根包的 ^x.y.z 约束会在这里解析失败。
dependency_overrides:
  w_tools_core: { path: ../packages/core }
  w_tools_async: { path: ../packages/async }
  w_tools_ui: { path: ../packages/ui }
  w_tools_form: { path: ../packages/form }
  w_tools_api: { path: ../packages/api }
  w_tools_app: { path: ../packages/app }
  w_tools_toast: { path: ../packages/toast }
  w_tools_map: { path: ../packages/map }
  w_tools_qr: { path: ../packages/qr }

flutter:
  uses-material-design: true

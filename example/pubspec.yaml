name: w_tools_example
description: "w_tools 聚合包最小示例：一个 WForm 表单，验证 package:w_tools/w_tools.dart 的真实用法。"
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  w_tools:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 本地开发用 pubspec_overrides.yaml 指向 workspace 子包（不随包发布）。
# 发布物里的 example 只能保留包内路径依赖，否则从 pub cache 里 pub get 会失败。

flutter:
  uses-material-design: true

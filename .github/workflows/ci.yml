name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # 与 .fvmrc 固定的一致（pubspec 要求 Flutter >= 3.38 / Dart ^3.10）。
  # 升级 Flutter 时同步改 .fvmrc、这里与 MIN_FLUTTER_VERSION，避免 CI 与本地解析出不同的依赖版本。
  FLUTTER_VERSION: '3.44.9'
  # 声明的最低版本：单独跑一遍，防止「声明支持 3.38 却用了 3.38 已移除的 API」。
  # 注意：pubspec 声明 `>=3.38.0`，这里实测 3.38.4 ——「实测高于声明」是保守方向；
  # 要抬声明下限时，pubspec 与这里一起改，不要只改一边。
  MIN_FLUTTER_VERSION: '3.38.4'

jobs:
  # 包矩阵由 scripts/packages.manifest 生成，不再手抄。
  # 以前手写列表漏过 app_getx / map_google：它们的测试只在本地跑；
  # `scripts/ci_matrix.py --check`（preflight 里）会挡住再手抄一份。
  matrix:
    name: Package matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      include: ${{ steps.emit.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Emit matrix from packages.manifest
        id: emit
        run: python3 scripts/ci_matrix.py --github-output >> "$GITHUB_OUTPUT"

  # 纯文档改动不必跑 17 个装 Flutter 的 job（umbrella + min_sdk + 15 个包）。
  # 分支保护只要求最后的 Required checks；packages / min_sdk 被 skip 不影响它。
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # workflow_dispatch 不跑 paths-filter，按「可能有代码变化」处理。
      code: ${{ steps.filter.outputs.code || 'true' }}
      # 只改 scripts/ 时跑 umbrella 的静态门禁，但不必跑 15 个包矩阵。
      static: ${{ steps.filter.outputs.static || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect code changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # 默认的 'some' 下，`!` 排除规则会匹配「不在排除范围里的所有文件」，
          # 结果就是过滤器永远为 true（PR #2 实测：3 个文档文件同时命中 code 和 static）。
          # 必须用 some-with-excludes：命中至少一个正向规则、且不命中任何排除规则。
          # v3 不支持该值，所以这里固定 @v4。
          #
          # 规则里**只写正向**，不要再加 `!` 排除：some-with-excludes 没有「再包含」语义，
          # 一条 `!packages/**/*.md` 会把 `packages/cli/templates/**` 里的模板 md 一起挡掉，
          # 模板类型写错 / 忘了跑 gen_templates 时就没有重量级 job 兜底（用 ci_matrix --check 守）。
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              # 子包源码 / 测试 / 工具 / example 的 dart 代码与清单
              - 'packages/**/*.dart'
              - 'packages/**/pubspec.yaml'
              - 'packages/**/pubspec.lock'
              - 'packages/**/analysis_options.yaml'
              - 'packages/**/assets/**'
              # golden / fixture / schema 不是 .dart，但同样是测试与发布契约的输入：
              # 只改它们时也必须跑对应的包测试与 dry-run（二轮审计 P1-3）。
              - 'packages/**/test/**'
              - 'packages/**/schema/**'
              - 'packages/**/*.json'
              - 'packages/**/.pubignore'
              # AGENTS 模板与 catalog 是生成物的源；改 .md 模板同样要跑生成物新鲜度
              - 'packages/cli/templates/**'
              - 'packages/cli/catalog/**'
              - 'lib/**'
              - 'test/**'
              - 'example/**/*.dart'
              - 'example/**/pubspec.yaml'
              - 'example/**/assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.pubignore'
              - '.github/workflows/ci.yml'
            static:
              # 门禁脚本、基线、manifest、快照：都是「跑 umbrella 才有意义」的输入
              - 'scripts/**/*.sh'
              - 'scripts/**/*.py'
              - 'scripts/**/*.yaml'
              - 'scripts/**/*.txt'
              - 'scripts/packages.manifest'
              - 'scripts/tests/**'
              # 反馈台账只有 `w_tools_cli:feedback lint` 能校验（需要 Dart + pub get），
              # 走 umbrella 的静态门禁；否则只改 docs/feedback/ 时没有任何 job 会真正检查它。
              - 'docs/feedback/**'
              # 生成物：手改后必须由 gen_catalog --check（需要 Dart）拦住。
              - 'docs/modules/components.md'
              # pre-push 钩子由 scripts/tests/test_pre_push_hook.py 覆盖。
              - '.githooks/**'
              # 本地 Flutter 版本 pin：ci_matrix --check 会比对 ci.yml 的 FLUTTER_VERSION。
              - '.fvmrc'

  # 纯文档改动不需要 Flutter；这里只跑文档 / 符号 / 版本 / 发版物料门禁。
  # 代码 PR 也会跑一遍，成本约几秒，避免 docs-only 与 code-only 两套 required check 分叉。
  docs:
    name: Docs (lightweight)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --disable-pip-version-check pyyaml

      # check_docs 现在包含文档符号 / 已删除 API / 安装版本（下界 == 当前版本）。
      # --skip-feedback：这个 job 不装 Flutter，反馈台账检查（需要 dart + pub get）在这里
      # 只会打印「环境不可用」；真正校验它在 umbrella 的 preflight 里（docs/feedback 改动
      # 会命中 static 过滤器 → umbrella）。
      - name: Docs gates
        run: PATH="$RUNNER_TEMP/docs-venv/bin:$PATH" bash scripts/check_docs.sh --skip-feedback

      # 只改 CHANGELOG / 文档时 `code` 过滤不命中，umbrella 会被 skip；
      # release_check 只依赖 bash + python3（不需要 Flutter），放在这个轻量 job 里兜底。
      - name: Release gates (no Flutter)
        run: bash scripts/release_check.sh

      # meta 门禁：每次 PR 都跑。即使路径过滤器被削弱、umbrella 被 skip，
      # 这里的 ci_matrix --check 也能发现「关键正向规则 / required 接线」被改掉。
      - name: Gate wiring (no Flutter)
        run: |
          export PATH="$RUNNER_TEMP/docs-venv/bin:$PATH"
          python3 scripts/ci_matrix.py --check
          python3 scripts/check_gate_coverage.py

  # 聚合包契约：w_tools.dart 的重导出（只做 re-export，配置走子包）。
  # 子包的行为测试已移入各自的 packages/<pkg>/test/，由下面的矩阵负责。
  # 纯文档改动跳过本 job，由上面的 docs job 覆盖。
  umbrella:
    name: Umbrella (w_tools)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.static == 'true'
    # 固定 runner 版本：ubuntu-latest 自 2026-10-19 起开始迁移到 Ubuntu 26，
    # 先钉住 24.04，确认迁移无影响后再改回 latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # preflight 里的 check_docs_facts / check_public_catalog / check_naming / ci_matrix --check
      # 都 `import yaml`；不要假设 runner 镜像自带 PyYAML（与 docs job 用同一套做法）。
      - name: Install check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/pip" install --disable-pip-version-check pyyaml

      # 静态门禁只有一份定义：scripts/preflight.sh。
      # 它覆盖 format / analyze / docs（链接、旧命令、反馈台账）/ 文档符号 /
      # 已删除 API / 公开类型 → catalog / 弃用到期 / 默认样式字面量 /
      # release check / CI 与包清单一致性。
      # 以前 CI 手抄了其中一部分，导致 check_public_catalog 与 check_deprecations
      # 在 CI 里根本没跑。
      - name: Static gates (preflight)
        run: PATH="$RUNNER_TEMP/check-venv/bin:$PATH" bash scripts/preflight.sh

      - name: Test (umbrella contract)
        run: flutter test

      - name: Test root example
        run: cd example && flutter test

      # 根包 dry-run 需要全部子包已发布；发布前失败是预期，不放进 CI。
      # 子包矩阵已各自跑 staged dry-run，根包发布前用 release_check --strict 把关。

  # 公开 API 变了但没抬版本：只比对 base 与 HEAD 的公开 API 表面，不需要 Flutter。
  # 只比对「barrel 导出的类型 / 成员 / 签名」，纯内部重构不会误报。
  api-bump:
    name: API / version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --online：用 pub.dev 的最新版本当「已发布基线」。仓库快照在批量发布窗口里可能
      # 滞后一个版本，只按快照判断会把「删线上已发布 API」当成未发布版本里的改动放行。
      # 取不到 pub.dev 时脚本回退到快照并打印提醒，不会因此卡住 PR。
      - name: Check public API changes bump the version
        run: python3 scripts/check_version_bump.py --base ${{ github.event.pull_request.base.sha }} --online

      # 行为变化没有公开 API diff，check_version_bump 看不到；只能按 PR 模板的
      # 「公开变化」勾选 + CHANGELOG 变更兜底。
      - name: Check PR declared scope
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # 空 body 与「本地没有 PR 上下文」必须区分：空 body 也要检查改动范围。
          PR_CONTEXT: '1'
        run: python3 scripts/check_pr_scope.py --base ${{ github.event.pull_request.base.sha }}

  # 声明的最低 Flutter 版本上再跑一遍：form 1.0.0 的 SizeTransition.alignment
  # 就是「声明支持 3.38、却在 3.38 编译失败」漏出去的。
  min_sdk:
    # 这里不能用 env 上下文（GitHub 在 job name 阶段不解析 env）；版本由下方 setup 步骤使用。
    name: Flutter declared minimum
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MIN_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # workspace analyze 会覆盖所有子包；umbrella 测试会编译所有子包的 lib
      - name: Analyze (minimum SDK)
        run: flutter analyze

      - name: Test (umbrella on minimum SDK)
        run: flutter test

  # 每个子包独立跑：analyze / test / 发布前校验。
  # 这一步保证「子包能独立发布」不是口号 —— 缺依赖、缺导出、缺发布物料都会在这里失败。
  #
  # 矩阵来自 packages.manifest（含 app_getx / map_google），`kind` 用 manifest 的
  # runner 列区分 Flutter / 纯 Dart；加新包时只改 manifest，不用动这个文件。
  packages:
    name: Package / ${{ matrix.package }}
    needs: [matrix, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # workspace 解析在根目录进行，子包不单独 pub get
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (Flutter package)
        if: matrix.kind == 'flutter'
        run: flutter analyze packages/${{ matrix.package }}

      - name: Analyze (pure Dart package)
        if: matrix.kind == 'dart'
        working-directory: packages/${{ matrix.package }}
        run: dart analyze

      - name: Compile generated UI templates
        if: matrix.package == 'cli'
        working-directory: packages/cli
        run: dart run tool/check_templates_compile.dart

      # example 会随包一起发布，必须能脱离 workspace 独立解析
      - name: Analyze example (published with package)
        if: matrix.kind == 'flutter' && hashFiles(format('packages/{0}/example/pubspec.yaml', matrix.package)) != ''
        working-directory: packages/${{ matrix.package }}/example
        run: |
          flutter pub get
          flutter analyze

      # 各包 example 的 smoke test：有 test 目录就运行，避免示例腐烂。
      - name: Test example (if present)
        if: matrix.kind == 'flutter' && hashFiles(format('packages/{0}/example/test/**', matrix.package)) != ''
        working-directory: packages/${{ matrix.package }}/example
        run: flutter test

      # 发布门禁：缺 README/CHANGELOG、版本号问题、未跟踪文件等在这一步暴露。
      # 用暂存副本发布：去掉 `resolution: workspace`，避免把仓库结构带进发布物。
      - name: Publish dry-run (package, staged)
        run: bash scripts/publish_package.sh packages/${{ matrix.package }} --dry-run

      - name: Test (Flutter package)
        if: matrix.kind == 'flutter'
        working-directory: packages/${{ matrix.package }}
        run: flutter test --coverage

      - name: Test (pure Dart package)
        if: matrix.kind == 'dart'
        working-directory: packages/${{ matrix.package }}
        run: dart test --coverage=coverage

      # 只有 cli 声明了 coverage 依赖；其它纯 Dart 包的 raw coverage 不转 lcov。
      - name: Format coverage (pure Dart package)
        if: matrix.package == 'cli'
        working-directory: packages/cli
        run: >-
          dart run coverage:format_coverage
          --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --package=.

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # 分支保护只需要这一个 required check。
  # docs-only 时 umbrella / min_sdk / packages 会 skipped（视为通过）；
  # 任何 failure / cancelled 都会让本 job 失败，避免 required check 名字随矩阵变化。
  required:
    name: Required checks
    if: always()
    needs: [matrix, changes, docs, umbrella, api-bump, min_sdk, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify dependency job results
        run: |
          # 这三个 job 必须真实成功；skipped 不算通过。
          for result in \
            "${{ needs.matrix.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.docs.result }}"; do
            if [ "$result" != "success" ]; then
              echo "required job failed: $result" >&2
              exit 1
            fi
          done

          # 这些按路径 / 事件门控，docs-only 或 push main 时允许 skipped。
          for result in \
            "${{ needs.umbrella.result }}" \
            "${{ needs.api-bump.result }}" \
            "${{ needs.min_sdk.result }}" \
            "${{ needs.packages.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required job failed: $result" >&2; exit 1 ;;
            esac
          done

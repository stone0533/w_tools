name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与本地 fvm 使用的版本保持一致（pubspec 要求 Flutter >= 3.38 / Dart ^3.10）。
  # 升级 Flutter 时同步改这里，避免 CI 与本地解析出不同的依赖版本。
  FLUTTER_VERSION: '3.44.9'
  # 声明的最低版本：单独跑一遍，防止「声明支持 3.38 却用了 3.38 已移除的 API」。
  MIN_FLUTTER_VERSION: '3.38.4'

jobs:
  # 聚合包契约：w.dart 的重导出、WConfig 兼容层。
  # 子包的行为测试已移入各自的 packages/<pkg>/test/，由下面的矩阵负责。
  umbrella:
    name: Umbrella (w_tools)
    # 固定 runner 版本：ubuntu-latest 自 2026-10-19 起开始迁移到 Ubuntu 26，
    # 先钉住 24.04，确认迁移无影响后再改回 latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本 / CHANGELOG / 根包依赖约束 / README 版本声明的一致性检查（不需要 Flutter）
      - name: Release readiness
        run: bash scripts/release_check.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (workspace)
        run: flutter analyze

      - name: Check docs
        run: bash scripts/check_docs.sh

      - name: Test (umbrella contract)
        run: flutter test

      # 发布必须在去掉 workspace 字段的暂存副本里做，否则消费方 `pub deps` 会去缓存里找
      # `packages/core` 而失败（2.0.0 踩过，见 docs/releasing.md）。
      - name: Publish dry-run (root, staged)
        run: bash scripts/publish_package.sh . --dry-run

  # 声明的最低 Flutter 版本上再跑一遍：form 1.0.0 的 SizeTransition.alignment
  # 就是「声明支持 3.38、却在 3.38 编译失败」漏出去的。
  min-sdk:
    name: Flutter ${{ env.MIN_FLUTTER_VERSION }} (declared minimum)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.MIN_FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # workspace analyze 会覆盖所有子包；umbrella 测试会编译所有子包的 lib
      - name: Analyze (minimum SDK)
        run: flutter analyze

      - name: Test (umbrella on minimum SDK)
        run: flutter test

  # 每个子包独立跑：analyze / test / 发布前校验。
  # 这一步保证「子包能独立发布」不是口号 —— 缺依赖、缺导出、缺发布物料都会在这里失败。
  packages:
    name: Package / ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [core, ui, form, api, app, toast, map, qr, cli]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # workspace 解析在根目录进行，子包不单独 pub get
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (Flutter package)
        if: matrix.package != 'cli'
        run: flutter analyze packages/${{ matrix.package }}

      - name: Analyze (pure Dart package)
        if: matrix.package == 'cli'
        working-directory: packages/cli
        run: dart analyze

      # example 会随包一起发布，必须能脱离 workspace 独立解析
      - name: Analyze example (published with package)
        if: matrix.package != 'cli' && hashFiles(format('packages/{0}/example/pubspec.yaml', matrix.package)) != ''
        working-directory: packages/${{ matrix.package }}/example
        run: |
          flutter pub get
          flutter analyze

      # 发布门禁：缺 README/CHANGELOG、版本号问题、未跟踪文件等在这一步暴露。
      # 用暂存副本发布：去掉 `resolution: workspace`，避免把仓库结构带进发布物。
      - name: Publish dry-run (package, staged)
        run: bash scripts/publish_package.sh packages/${{ matrix.package }} --dry-run

      - name: Test (Flutter package)
        if: matrix.package != 'cli'
        working-directory: packages/${{ matrix.package }}
        run: flutter test --coverage

      - name: Test (pure Dart package)
        if: matrix.package == 'cli'
        working-directory: packages/cli
        run: dart test --coverage=coverage

      - name: Format coverage (pure Dart package)
        if: matrix.package == 'cli'
        working-directory: packages/cli
        run: >-
          dart run coverage:format_coverage
          --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --package=.

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

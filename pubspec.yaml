name: w_tools
description: "聚合 8 个子包的 Flutter 工具库：涵盖 UI 组件、表单、网络、Toast、二维码、地图与核心工具，帮助开发者快速构建高质量的 Flutter 应用。"
version: 2.0.1
homepage: https://github.com/stone0533/w_tools
repository: https://github.com/stone0533/w_tools
issue_tracker: https://github.com/stone0533/w_tools/issues
documentation: https://github.com/stone0533/w_tools/wiki
topics:
  - flutter
  - widgets
  - toolkit
  - utilities

workspace:
  - packages/core
  - packages/app
  - packages/form
  - packages/ui
  - packages/api
  - packages/toast
  - packages/map
  - packages/qr

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  w_tools_core: ^1.0.0
  w_tools_app: ^1.0.0
  w_tools_form: ^1.0.0
  w_tools_ui: ^1.0.0
  w_tools_api: ^1.0.0
  w_tools_toast: ^1.0.0
  w_tools_map: ^1.1.0
  w_tools_qr: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

name: w_tools
description: "聚合 6 个基础子包的 Flutter 工具库：涵盖 UI 组件、表单、网络、Toast、应用启动与核心工具，帮助开发者快速构建高质量的 Flutter 应用。"
version: 7.0.4
homepage: https://github.com/stone0533/w_tools
repository: https://github.com/stone0533/w_tools
issue_tracker: https://github.com/stone0533/w_tools/issues
documentation: https://github.com/stone0533/w_tools/wiki
topics:
  - flutter
  - widgets
  - toolkit
  - utilities

workspace:
  - packages/core
  - packages/app
  - packages/form
  - packages/ui
  - packages/api
  - packages/toast
  - packages/map
  - packages/qr
  - packages/async
  - packages/cli
  - packages/figma
  - packages/device
  - packages/e2e

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  w_tools_core: ^3.1.0
  w_tools_form: ^4.4.0
  w_tools_ui: ^5.1.0
  w_tools_api: ^5.0.0
  w_tools_toast: ^2.0.0
  w_tools_async: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

name: w_tools
description: "一个功能丰富的 Flutter 工具库，提供了多种实用工具和组件，帮助开发者快速构建高质量的 Flutter 应用。"
version: 1.1.0
publish_to: none
homepage: https://github.com/stone0533/w_tools
repository: https://github.com/stone0533/w_tools
issue_tracker: https://github.com/stone0533/w_tools/issues
documentation: https://github.com/stone0533/w_tools/wiki

workspace:
  - packages/core
  - packages/app
  - packages/form
  - packages/ui
  - packages/api
  - packages/toast
  - packages/map
  - packages/qr

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  w_tools_core:
    path: packages/core
  w_tools_app:
    path: packages/app
  w_tools_form:
    path: packages/form
  w_tools_ui:
    path: packages/ui
  w_tools_api:
    path: packages/api
  w_tools_toast:
    path: packages/toast
  w_tools_map:
    path: packages/map
  w_tools_qr:
    path: packages/qr

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  dio: ^5.9.2
  get: ^4.7.3
  google_maps_flutter: any
  qr_code_scanner_plus: any
  flutter_form_builder: ^10.3.0+2
  bot_toast: ^4.1.3

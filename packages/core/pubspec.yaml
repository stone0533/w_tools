  logger: ^2.6.2
  encrypt: ^5.0.3
  crypto: ^3.0.7
  convert: ^3.1.2
  synchronized: ^3.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^4.0.0

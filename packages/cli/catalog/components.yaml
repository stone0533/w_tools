  - name: '`WAsync`'
    package: 'w_tools_async'
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '无 UI 异步执行（tryRun / run / 组合器）'
    dontUseFor: '页面四态用 `WAsyncController` + `WAsyncView`；不要用已删除的 `runValue` / `WAsyncLoading`'
    usage: |
      final result = await WAsync.tryRun(() => api.fetch());
      switch (result) {
        case WAsyncSuccess(:final value): use(value);
        case WAsyncFailure(:final error): log(error);
        case WAsyncCancelled(): log('cancelled');
      }
      final value = await WAsync.run(() => api.fetch());
      final name = await WAsync.map(() => api.fetch(), onSuccess: (v) => v.name);
    pitfalls:
      - 'run 失败抛异常；tryRun 不抛异常'
      - 'onSuccess 只属于 WAsync.map；WAsync.run 不接受 onSuccess'
      - '取消需要 WCancelToken；取消不中止底层 Future'
    related: ['WAsyncResult', 'WAsyncOptions', 'WAsyncActivity', 'WCancelToken']
    aliases: ['tryRun', 'run', 'map', 'retry']

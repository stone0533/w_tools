# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart（tool/gen_catalog.dart）。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '页面容器：背景色、状态栏样式、底部安全区'
    dontUseFor: '不要在页面里再手写 `Scaffold` 包一层'
  - name: '`WAppBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏'
    dontUseFor: '不要自己写 `BottomNavigationBar`'
  - name: '`WTabBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '顶部 tab'
    dontUseFor: '需要下划线跟随的复杂交互时先看它够不够'
  - name: '`WStep`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
  - name: '`WText` / `WTextConfig`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '所有文字（字体、字重、行高、颜色）'
    dontUseFor: '不要裸用 `Text` —— 字体会漏配 NotoSansTC'
  - name: '`WRichText`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '一段文字里多种颜色/字重'
    dontUseFor: '单色文本用 `WText` 更省事'
  - name: '`WImage`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '网络图/资源图（缓存、重试、占位）'
    dontUseFor: '不要裸用 `Image.network`'
  - name: '`WButton`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '真正的按钮（label/icon + variant/size/loading）'
    dontUseFor: '任意 child 点击用 `WPressable`；表单按钮用 `WFormButton`'
  - name: '`WPressable`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果'
    dontUseFor: '需要 button 语义时用 `WButton`'
  - name: '`WRowButtons`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '一行多个按钮'
  - name: '`WBadge`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '角标数字'
  - name: '`WRow` / `WColumn` / `WPadding` / `WSizeBox`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '常用布局糖'
  - name: '`WClipRRect`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '裁剪'
  - name: '`WFormTextField` / `WForm.textFieldStyle1`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '输入框（含校验、清除、密码显隐）'
    dontUseFor: '**不要**自己画 `Container + TextField`'
  - name: '`WFormBorder` / `WForm.field`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '输入框的框与标签（错误态）'
  - name: '`WFormDropdown` / `WFormMultiDropdown`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '下拉、多选'
    dontUseFor: '选择类面板用 `WForm.showBottomSheet`（ADR-0002）'
  - name: '`WFormCheckbox` / `WFormRadioGroup`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '复选、单选'
  - name: '`WFormDatePicker`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '日期选择'
  - name: '`WFormValidator*`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '表单校验'
  - name: '`WFormButton`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '带样式的按钮（登录/注册/主按钮）'
    dontUseFor: '任意内容点击用 `WPressable`'
  - name: '`WBottomSheet`'
    package: 'w_tools_app'
    section: '6. 弹层'
    useFor: '底部面板外壳'
  - name: '`WForm.showBottomSheet`'
    package: 'w_tools_form'
    section: '6. 弹层'
    useFor: '选择类面板（42 高行、无勾选图标）'
    dontUseFor: '**不要**自己写 sheet（ADR-0002）'
  - name: '`WFormPopup`'
    package: 'w_tools_form'
    section: '6. 弹层'
    useFor: '**锚定式**下拉弹层（贴在输入框下方）'
    dontUseFor: '⚠️ 它不是居中对话框，别拿来做「确认弹窗」'
  - name: '`WToast` / `WnnToast`'
    package: 'w_tools_toast'
    section: '7. 状态与反馈'
    useFor: '轻提示'
  - name: '`WGradientCircularProgressIndicator`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '加载指示'
  - name: '`WListView` / `WListViewConfig`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表（分页、下拉刷新）'
  - name: '`WApp` / `WAppPlugin`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '启动器与插件分层初始化'
  - name: '`WAsync` / `WCountdown` / `WCancelToken`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '异步、倒计时、取消'
  - name: '`WStorage` / `WToken` / `WEncrypt` / `WHash`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '存储、令牌、加密、摘要'
  - name: '`WLogger` / `WValidator` / `WRegExp`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '日志、校验、正则'
  - name: '`WApiConfig`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求配置与日志注入'
  - name: '`WRoute`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '路由工具'

  - name: '`WAsyncResult`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '`WAsync.tryRun` 的成功 / 失败 / 取消结果'
    dontUseFor: '需要失败抛异常时用 `WAsync.run`'
    usage: 'switch (result) { case WAsyncSuccess(:final value): ... }'
    pitfalls:
      - '需要失败抛异常时用 WAsync.run'
      - 'isProgrammingError 只存在于 WAsyncFailure'
    related: ['WAsync', 'WAsyncController']
    teach: true

  - name: '`WAsync` / `WAsyncOptions` / `WAsyncActivity` / `WCancelToken`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '无 UI 异步执行（tryRun/run）、取消与活动计数'
    aliases: ['tryRun', 'run', 'map', 'retry', 'timeout', 'parallel', 'pool', 'serial', 'first']
    usage: |
      final result = await WAsync.tryRun(() => api.fetch());
      switch (result) {
        case WAsyncSuccess(:final value): use(value);
        case WAsyncFailure(:final error): log(error);
        case WAsyncCancelled(): log('cancelled');
      }
      final value = await WAsync.run(() => api.fetch()); // 失败抛异常
      final name = await WAsync.map(() => api.fetch(), onSuccess: (v) => v.name);
    pitfalls:
      - 'run 失败抛异常；tryRun 不抛异常'
      - 'onSuccess 只属于 WAsync.map；WAsync.run 不接受 onSuccess'
      - '取消需要 WCancelToken；取消不中止底层 Future'
    related: ['WAsyncResult', 'WAsyncOptions', 'WCancelToken']
    teach: true


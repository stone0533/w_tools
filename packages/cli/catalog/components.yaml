    dontUseFor: '不要直接 `Dio()`；同一 baseUrl 只配置一次'
    usage: "final r = DioRegistry.forBaseUrl('https://api.example.com'); await r.dio.get('/users');"
    pitfalls:
      - "同一 baseUrl 只能初始化一次；换配置用 `replace: true` 或先 dispose"
      - "`validateStatus` / `requestEncoder` / `responseDecoder` 按函数实例引用比较：语义相同的新闭包也算冲突，复用同一实例或传 `replace: true`"
      - "`replace` 会 close(force: true)；LRU / TTL 淘汰用 close(force: false)，不强制中断在途请求"

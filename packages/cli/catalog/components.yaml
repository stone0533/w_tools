  - name: '`WAsyncController`'
    package: 'w_tools_async'
    docsAnchor: 'wasynccontroller'
    section: '3. Controller'
    useFor: '单区块异步状态、load / replaceData / 旧请求丢弃'
    dontUseFor: '分页用 `WAsyncPagedController`；纯执行用 `WAsync`；多个独立区块不要共用一个 controller，每块一个 controller + WAsyncView'
    usage: |
      final c = WAsyncController.list((_) => api.list(), onError: (e) => log(e)); c.load();
      final withToken = WAsyncController((token) => api.list(token: token));
      c.replaceData(next);              // 本地替换：取消在飞 load，旧结果不写回
      c.isRetrying;                     // 首屏 false；失败后重试 loading true
      @override
      void dispose() { c.dispose(); super.dispose(); }
    pitfalls:
      - '页面 dispose 时 controller.dispose()'
      - 'loader 统一接收 WCancelToken；不需要取消时写 (_) => ...'
      - 'list 的 state.data 是 unmodifiable；需要可变副本请自己 List.of'
      - 'replaceData 会取消在飞 load；需要服务端校准时再 load()'
      - 'initial 也会走 empty / unmodifiable；不要依赖 initial: ready([]) 显示空数据'
      - 'onError 不带 StackTrace；完整堆栈用 WAsyncFailure 或 loader 内记录'
      - 'loader 只读取 token，不要自己 cancel'
      - 'isRetrying 只表示当前失败后重试；首屏 loading 为 false'
    related: ['WAsyncView', 'WAsyncState', 'WAsyncPagedController']
    teach: true

  - name: '`WAsyncPagedController`'
    package: 'w_tools_async'
    docsAnchor: 'wasyncpagedcontroller'
    section: '3. Controller'
    useFor: '分页列表：首屏、刷新、追加、hasMore、本地替换（recipe: docs/recipes/paged-list.md）'
    dontUseFor: '普通单请求用 `WAsyncController`'
    usage: |
      final c = WAsyncPagedController<Item>((page, token) async {
        final resp = await api.list(page: page, token: token);
        return WAsyncPage(items: resp.list, hasMore: resp.total > page * 20);
      });
      await c.refresh();
      await c.loadMore();
      c.snapshot.addListener(() { ... });        // 唯一观察入口
      final footer = c.snapshot.value;           // state / footerStatus / loadMoreError / hasMore
      WAsyncView(state: c.state, ...);           // 列表四态仍用 state
      c.replaceData(next);                       // 取消在飞 refresh / loadMore
    pitfalls:
      - 'loadMore 失败只写 snapshot.loadMoreError，不要清空列表'
      - 'footer 读 snapshot.footerStatus，不要自己用 data / error / hasMore 拼'
      - '不要维护 hasLoadedMorePage；footerStatus 已区分首屏到底 / 翻页后到底'
      - 'initial: ready([]) / empty 视为没有更多'
      - '切换筛选直接再 refresh()：在飞请求会被取消，不要禁用筛选'
      - 'replaceData 会取消在飞 refresh/loadMore；hasMore 默认继承，空列表 hasMore=false'
      - 'initialPage 是 1-based；0-based 后端在 loader 内减 1'
      - '只支持 page 型分页；cursor 分页需自定义 adapter'
      - 'initial 的列表会变成 empty / unmodifiable；不要依赖 ready([])'
      - '首屏空 footer 是 hidden；loadMore 空页是 noMore；replaceData 非空完整列表也保持 noMore'
    related: ['WAsyncView', 'WAsyncController', 'WAsyncPagedSnapshot', 'WAsyncPagedFooterStatus']
    teach: true

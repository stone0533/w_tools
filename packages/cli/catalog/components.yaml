  - name: '`WApiClient`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: 'GET / POST / PUT / PATCH / DELETE / HEAD / OPTIONS 统一调用 + 显式 JSON 解码 + 上传'
    dontUseFor: '不要在页面里直接拼 URL；不要用它替代 Repository 的业务编排'
    usage: |
      final client = WApiClient(registry.dio);
      final user = await client.get(
        '/users/{id}',
        pathParameters: {'id': '42'},
        decode: (json) => User.fromJson(json as Map<String, dynamic>),
      );
      await client.head('/users/42');
      await client.upload<void>(
        '/files',
        method: 'PUT',
        files: {'file': MultipartFile.fromBytes(bytes)},
        decode: WApiDecoders.none,
      );
    pitfalls:
      - "decode 必须显式传：Dart 没有反射，不会自动把 JSON 变成模型"
      - "decode 抛错会包装成 WApiException(kind: decode)；HTTP / 网络错误统一为 WApiException"
      - "decode 为空时返回原始 JSON，不会自动推断类型"
      - "head / options 只用于探测，不解析响应体；upload 的 method 只支持 POST / PUT / PATCH"
      - "需要 status / headers 用 send（返回 WApiResponse）；get / post 只返回 data"
      - "单条请求的 dio 配置用 `options:`（关重试 / validateStatus / responseType）；headers 参数优先于 options.headers"
      - "下载要 headers / 文件名用 downloadResponse；分页 total 在响应头用 readTotalFromResponse"
      - "单条请求临时覆盖信封用 `send(..., envelope: ...)`；`page` 已弃用"
      - "`download` 已弃用（7.0 删除）；用 `downloadResponse` 取 bytes + headers"
    related: ["`DioRegistry`", "`WApiBody`", "`WApiException`", "`WApiResponse`"]
    teach: true

  - name: '`WApiBody`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求体编码：json / form / multipart / bytes'
    dontUseFor: '不要用它承载业务逻辑；它只决定怎么编码'
    usage: |
      await client.post('/users', body: WApiBody.json({'name': 'Ada'}));
      await client.post('/files', body: WApiBody.multipart(
        fields: {'bucket': 'avatar'},
        files: {'file': MultipartFile.fromBytes(bytes)},
      ));
    pitfalls:
      - "multipart 的 files 是 Map：key 是字段名，value 是 MultipartFile"
      - "Web 上不要用 MultipartFile.fromFile，改用 fromBytes"
      - "`bytes` 省略 `contentType` 时由 `WApiClient` 兜底 `application/octet-stream`；直接用 dio 发要自己传"
    related: ["`WApiClient`"]

  - name: '`WApiException`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '统一网络错误分类：timeout / network / 401 / 4xx / 5xx / decode'
    dontUseFor: '不要在库里写死用户文案；UI 按 kind 映射'
    usage: |
      try {
        await client.get('/me', decode: (json) => User.fromJson(json as Map<String, dynamic>));
      } on WApiException catch (error) {
        if (error.requiresLogin) { /* 清会话、跳登录 */ }
      }
    pitfalls:
      - "message 是技术描述，不是用户文案；UI 用 kind 决策"
      - "kind 取值：timeout / network / unauthorized / forbidden / notFound / client / server / canceled / decode / unknown / business"
      - "payload 保留原始响应体，便于业务读取错误码"
    related: ["`WApiClient`"]

  - name: '`WApiEnvelopeParser`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '可选业务信封解析：{code, message, data}'
    dontUseFor: '不要默认开启；不是所有后端都用信封'
    usage: |
      final client = WApiClient(
        registry.dio,
        envelope: WApiEnvelopeParser(
          readCode: (json) => (json as Map)['code'],
          readData: (json) => (json as Map)['data'],
          isSuccess: (code) => code == 0,
          authFailureCodes: {401},
        ),
        onAuthFailure: (error) { /* 清会话、跳登录 */ },
      );
    pitfalls:
      - "业务码失败抛 WApiException(kind: business)，用 businessCode 判断"
      - "命中 authFailureCodes 时抛 unauthorized 并调用 WApiClient.onAuthFailure"
      - "HTTP 401 仍由 WTokenInterceptor 处理；不要把登录失效只放在业务码里"
      - "204 / 空 body 默认跳过信封（skipEmptyBody）；旧行为显式传 false"
      - "单条请求覆盖信封用 `send` / `page` 的 `envelope` 参数"
    related: ["`WApiClient`", "`WApiException`"]

  - name: '`WPage`'

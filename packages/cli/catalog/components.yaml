# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart 与 docs/modules/components.md 的 §1~§9 表格。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '页面壳：默认 WAppBar、body、底部导航/FAB、安全区'
    dontUseFor: '任意顶部叠放用页面层 Container/Stack'
    usage: "WScaffold(appBar: WAppBar(title: Text('\u9996\u9875')), body: ...)"
    pitfalls:
      - "\u4e0d\u8981\u624b\u62fc Scaffold + SafeArea\uff1b\u9875\u9762\u58f3\u7edf\u4e00\u7528 WScaffold"
    related: ["`WAppBar`", "`WNavBar`"]
    teach: true

  - name: '`WAppBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏；controller 需 vsync 并由页面 State dispose'
    dontUseFor: '不要自己写 `BottomNavigationBar`'
  - name: '`WTabBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '顶部 tab；依赖 TabController / DefaultTabController'
    dontUseFor: '需要下划线跟随的复杂交互时先看它够不够'
  - name: '`WStep` / `WStepFlow`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
    dontUseFor: '背景/高度用外层 Container；多步骤注意横向空间'
  - name: '`WText` / `WTextVariant` / `WTextStyles`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '语义文字样式、overrides、maxLines、textScaler'
    dontUseFor: '不要再用 `WTextConfig`；已移除，使用 `WTextStyles`'
    usage: "WText('\u5185\u5bb9', variant: WTextVariant.body)"
    pitfalls:
      - "\u4e0d\u8981\u518d\u7528 WTextConfig\uff1b\u6837\u5f0f\u7edf\u4e00 WTextStyles"
    related: ["`WTextStyles`"]
    teach: true

  - name: '`WImage`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '网络图/资源图（缓存、重试、占位）'
    dontUseFor: '不要裸用 `Image.network`'
    usage: "WImage.source(source: WImageSource.network(url))"
    pitfalls:
      - "\u65e7 WImage.network/asset/data \u5df2\u5728 6.0 \u5220\u9664"
      - "\u672a\u77e5\u6765\u6e90\u7528 WImageSource.parse"
    related: ["`WImageSource`"]
    teach: true

  - name: '`WImageSource`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: 'WImage 的来源：network / asset / file / base64 / provider / parse'
    dontUseFor: '不要用已删除的 WImage.network / asset / file / data'
    usage: 'WImage.source(source: WImageSource.network(url))'
    pitfalls:
      - '旧 WImage.network/asset/file 已删除'
      - '未知字符串用 WImageSource.parse'
    related: ['`WImage`']
    teach: true
  - name: '`WButton`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '真正的按钮（label/icon + style/size/loading）'
    dontUseFor: '任意 child 点击用 `WPressable`'
    usage: "WButton(label: '\u4fdd\u5b58', onPressed: save)"
    pitfalls:
      - "\u4efb\u610f child \u70b9\u51fb\u7528 WPressable\uff0c\u4e0d\u8981\u5957 WButton"
    related: ["`WPressable`"]
    teach: true

  - name: '`WPressable`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果（无 button 语义）'
    dontUseFor: '需要 button 语义时用 `WButton`'
  - name: '`WActionRow` / `WSelectableRow`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '横向滚动按钮行：`WActionRow` 无选中、`WSelectableRow` 单选高亮'
    dontUseFor: '旧的 `WRowButtons` 已在 5.0 删除；纯静态排列直接用 `Row`'
  - name: '`WBadge`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '角标数字'
  - name: '`WClipRRect`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '裁剪'
  - name: '`WScreen`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '屏幕 / 字体适配（w/h/sp）、状态栏 / 底部安全区'
    dontUseFor: '不要重复用 MediaQuery 手写全局适配'
  - name: '`WAssets`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '图片资源前缀唯一开关'
    dontUseFor: '不要硬编码 `assets/images/`'
  - name: '`WForm`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面表单容器：主题 / Scope / 只读 / 默认字段样式 / 默认校验'
    dontUseFor: '不要手写 `WFormTheme + WFormScope + WFormReadOnlyScope`'
    usage: "WForm(controller: form, child: WFormTextField(name: 'email'))"
    pitfalls:
      - "\u4e00\u4e2a WForm \u5bf9\u5e94\u4e00\u4e2a WFormController"
      - "\u8868\u5355\u5b57\u6bb5\u7528\u76f4\u63a5\u53c2\u6570\uff0c\u4e0d\u8981\u4ece Config.build \u5f00\u59cb"
    related: ["`WFormController`", "`WFormTextField`"]
    teach: true

  - name: '`WFormController`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '表单数据 / 字段值 / 校验入口'
    dontUseFor: '多个 WForm 不要共用一个 controller'
  - name: '`WFormTextField`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接文本 / 密码字段（label / message / validator）'
    dontUseFor: '不要默认写 `WFormTextFieldConfig().build(...)`'
    usage: "WFormTextField(name: 'email', hintText: '\u90ae\u7bb1', validator: ...)"
    pitfalls:
      - "\u4e0d\u8981\u518d\u4f20 config: WFormTextFieldConfig"
    related: ["`WForm`", "`WFormFieldStyle`"]
    teach: true

  - name: '`WFormDropdown`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接下拉字段（items / 初始值 / icon / contentPadding）'
    dontUseFor: '多选用 `WFormMultiDropdown`；自定义弹层用 `WFormPopup`'
    usage: "WFormDropdown<String>(name: 'city', items: {'sh': '上海'})"
    pitfalls:
      - '初始值与回填值必须存在于 items，否则 FormBuilderDropdown 断言失败'
      - 'hintText 优先于历史参数 label'
    related: ['WFormTextField', 'WFormMultiDropdown']
    teach: true

  - name: '`WFormMultiDropdown`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接多选字段（items / disabledKeys / 选项样式）'
    dontUseFor: '单选用 `WFormDropdown`'
    usage: "WFormMultiDropdown(name: 'tags', items: {'a': 'A'}, disabledKeys: {'b'})"
    pitfalls:
      - '字段值是 Set<String>；已选中且被 disabled 的项显示选中态但不可取消'
      - '未配置 hintText 时不显示占位（与 WFormDropdown 一致）；建议总是传业务文案'
    related: ['WFormDropdown', 'WFormPopup']
    teach: true

  - name: '`WFormDatePicker`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接日期字段（displayFormat / firstDate / lastDate）'
    dontUseFor: '时间选择不在本组件范围；自定义弹层用 `WFormPopup`'
    usage: "WFormDatePicker(name: 'birthday', label: '生日', displayFormat: 'yyyy-MM-dd')"
    pitfalls:
      - 'firstDate / lastDate 默认 1900 到当天；需要未来日期必须显式传 lastDate'
      - 'hintText 与 label 都作为占位符，hintText 优先'
    related: ['WFormTextField', 'WFormFieldStyle']
    teach: true

  - name: '`WFormCheckbox`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接复选字段（title 必填，默认 bordered: false）'
    dontUseFor: '多选用 `WFormMultiDropdown`'
    usage: "WFormCheckbox(name: 'agree', title: Text('同意'))"
    pitfalls:
      - 'title 必填；需要边框 / message 时显式传 bordered: true'
    related: ['WFormRadioGroup', 'WFormFieldStyle']
    teach: true

  - name: '`WFormRadioGroup`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接单选字段（items / titleBuilder / lineSpacing）'
    dontUseFor: '多选用 `WFormMultiDropdown`'
    usage: "WFormRadioGroup<String>(name: 'gender', items: {'male': '男'})"
    pitfalls:
      - 'titleBuilder 是每个选项的标题，不是分组标题'
      - '默认 bordered: false；需要边框 / message 时显式传 bordered: true'
    related: ['WFormCheckbox', 'WFormFieldStyle']
    teach: true

  - name: '`WFormButton`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接自定义字段按钮（选择、弹层触发）'
    dontUseFor: '普通业务按钮用 `WButton`；底层 `*Core` 已内部化，不要直接使用'
    usage: "WFormButton(name: 'coupon', label: '请选择优惠券', onTap: (value, didChange) => didChange('new_user'))"
    pitfalls:
      - '写值只能通过 onTap 拿到的 didChange；字段卸载后再调会被包内保护忽略'
      - '显示已选值用 selectedWidgetBuilder，不要在外面再维护一份状态'
    related: ['WForm', 'WFormPopup']
    teach: true

  - name: '`WFormFieldStyle`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面级字段默认高度 / 内边距 / 文字 / hint 样式'
    dontUseFor: '字段级差异用直接字段参数；单字段样式用 `WFormFieldStyleScope` 包裹'
  - name: '`WFormValidatorSettings`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '校验行为：边框错误、短路 / 全量、回调'
  - name: '`WFormBorder`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '低层边框 / 错误展示；普通页面由 `WForm` 统一提供'
    dontUseFor: '普通字段不要手写 `WFormBorder`'

  - name: '`WFormBorderConfig`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '不可变边框配置：默认 / 聚焦 / 错误 / 只读装饰与 hint/error 样式'
    dontUseFor: '普通字段不要手写 `WFormBorder`；配置通过 `WForm(borderConfig: ...)` 下发'
    usage: 'WFormBorderConfig.fromTheme(Theme.of(context))'
    pitfalls:
      - '`standard()` 是显式浅色预设，不跟随深色主题；新代码用 `fromTheme`'
      - '`copyWith(null)` 不会清空字段；清空要重新构造配置'
    related: ['WForm', 'WFormBorder']
    teach: true

  - name: '`WFormBorderDecoration`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '边框装饰值对象：border / color / borderRadius / boxShadow / gradient'
    dontUseFor: '不要用 `Container(decoration:)` 代替 `WFormBorder`'

  - name: '`WFormIcons`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '表单图标集合（下拉 / 勾选 / 单选 / 密码 / 清空）'
    dontUseFor: '`WFormDefaults` 已删除；单字段 icon 参数优先于它'

  - name: '`WFormFieldStyleScope`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '单个字段覆盖 `WForm.fieldStyle`（高度 / 内边距 / 文字 / hint）'
    dontUseFor: '整页样式直接传 `WForm.fieldStyle`，不要逐字段包一层'

  - name: '`WFormValidator`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '统一校验入口：短路 / 全量、边框错误、错误汇总'
    dontUseFor: '不要同时用 `formKey.validate()`，会形成两套错误通道'
    usage: "form.validators(items: [WFormValidatorItem.field('email')]).validate()"
    pitfalls:
      - '错误默认只走边框；关掉 `showBorderError` 就只剩 `errors` 汇总'
      - '字段 validator 的错误不会写入 `errorText`（避免双通道）'
    related: ['WFormController', 'WFormValidatorItem']
    teach: true

  - name: '`WFormValidatorItem`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '单个校验项：自定义规则或复用字段自身 validator'
    dontUseFor: '字段自带 validator 已够用时不要重复声明规则'

  - name: '`WFormTextFieldAction` / `WFormTextFieldPasswordToggle` / `WFormTextFieldClearButton`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '文本字段插槽 action：自定义按钮 / 密码可见切换 / 清空'
    dontUseFor: '不要自己用 `InheritedWidget` 读输入状态；用 `WFormTextFieldScope.of`'
  - name: '`WBottomSheet`'
    package: 'w_tools_app_getx'
    section: '6. 弹层'
    useFor: '底部面板外壳'
  - name: '`WFormPopup`'
    package: 'w_tools_form'
    section: '6. 弹层'
    useFor: '**锚定式**下拉弹层（贴在输入框下方）'
    dontUseFor: '⚠️ 它不是居中对话框，别拿来做「确认弹窗」'
  - name: '`WAsyncView` / `WAsyncErrorView` / `WAsyncErrorBanner`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '普通页面异步四态视图、默认重试页与刷新错误条'
    dontUseFor: '滚动页面用 `WAsyncStateBuilder`；纯状态逻辑用 `WAsyncState` / `WAsyncController`'
    usage: 'WAsyncView(state: c.state, onRetry: c.load, readyBuilder: (context, data) => ...)'
    pitfalls:
      - 'Controller 必须先 load()，否则一直是 loading'
      - 'onRetry 为 null 时不渲染重试按钮'
    related: ['WAsyncController', 'WAsyncTheme', 'WAsyncStateBuilder']
    teach: true

  - name: '`WAsyncStateBuilder`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '滚动页面 / `SmartRefresher` / 自定义状态布局'
    dontUseFor: '普通页面优先用 `WAsyncView`；旧 `WAsyncBuilder` 已删除'
    usage: "WAsyncStateBuilder(state: c.state, builder: (context, state) => ...)"
    pitfalls:
      - "builder \u5fc5\u987b\u59cb\u7ec8\u8fd4\u56de\u540c\u4e00\u4e2a\u6eda\u52a8\u58f3\uff0c\u4e0d\u8981\u5728\u5916\u5c42\u5207 Center"
    related: ["`WAsyncView`", "`WAsyncThemeViews`"]
    teach: true

  - name: '`WAsyncController`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '单区块异步状态、load / retry / 旧请求丢弃'
    dontUseFor: '分页用 `WAsyncPagedController`；纯执行用 `WAsync`'
    usage: 'final c = WAsyncController.list(() => api.list()); c.load();'
    pitfalls:
      - '页面 dispose 时 controller.dispose()'
      - '不要给 Controller 传 options.activity'
    related: ['WAsyncView', 'WAsyncState', 'WAsyncPagedController']
    teach: true

  - name: '`WAsyncPagedController`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '分页列表：首屏、刷新、追加、hasMore（recipe: docs/recipes/paged-list.md）'
    dontUseFor: '普通单请求用 `WAsyncController`'
    usage: "final c = WAsyncPagedController<Item>((page) => api.list(page: page)); await c.refresh();"
    pitfalls:
      - "loadMore \u5931\u8d25\u53ea\u5199 loadMoreError\uff0c\u4e0d\u8981\u6e05\u7a7a\u5217\u8868"
      - "initial: ready([]) / empty \u89c6\u4e3a\u6ca1\u6709\u66f4\u591a"
    related: ["`WAsyncView`", "`WAsyncController`"]
    teach: true

  - name: '`WAsyncStateSliver`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'CustomScrollView 的四态 sliver、failed+旧数据'
    dontUseFor: '非滚动页面用 `WAsyncView`'
    usage: "WAsyncStateSliver(state: c.state, onRetry: c.load, readySliverBuilder: ...)"
    pitfalls:
      - "readySliverBuilder \u5fc5\u987b\u8fd4\u56de sliver\uff1b\u4e0d\u8981\u5305\u5728 WAsyncView \u91cc"
    related: ["`WAsyncStateBuilder`", "`WAsyncTheme`"]
    teach: true

  - name: '`WAsyncTheme`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'App 根部统一默认 loading / empty / error（普通 + sliver）'
    dontUseFor: '不要用它包装单个页面；单个 WAsyncView 的显式 builder 优先'
    related: ['WAsyncThemeViews', 'WAsyncView', 'WAsyncStateSliver']
    usage: "WAsyncTheme(strings: const WAsyncStrings(empty: '\u6682\u65e0\u6570\u636e'), child: app)"
    pitfalls:
      - "\u666e\u901a builder \u53ea\u4f5c\u7528\u4e8e WAsyncView\uff1bsliver \u7528 sliver*Builder"
    teach: true

  - name: '`WAsyncThemeViews`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '自建滚动壳复用 WAsyncTheme 的默认四态视图'
    dontUseFor: '普通页面直接用 WAsyncView，不要重复搭状态分支'
    usage: 'final views = WAsyncThemeViews.of(context);'
    pitfalls:
      - '普通页面直接用 WAsyncView，不要重复搭四态分支'
    related: ['WAsyncTheme', 'WAsyncStateBuilder']
    teach: true

  - name: '`WToast`'
    package: 'w_tools_toast'
    section: '7. 状态与反馈'
    useFor: '轻提示'
    usage: "WToast.showSuccess('\u4fdd\u5b58\u6210\u529f');"
    pitfalls:
      - "\u5148\u6302 BotToastInit / BotToastNavigatorObserver"
    related: ["`WToastStyle`"]
    teach: true

  - name: '`WToastStyle`'
    package: 'w_tools_toast'
    section: '7. 状态与反馈'
    useFor: 'Toast 的时长 / 对齐 / 背景 / 动画等样式'
    dontUseFor: '不要为单条 toast 重复造主题；全局用 WToastTheme'
    usage: "WToast.showSuccess('保存成功', style: WToastStyle(duration: Duration(seconds: 2)))"
    pitfalls:
      - '先初始化 BotToastInit / BotToastNavigatorObserver'
    related: ['`WToast`']
    teach: true
  - name: '`WGradientCircularProgressIndicator`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '加载指示'
  - name: '`WListView` / `WListViewSliver`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表（独立滚动 / SmartRefresher sliver）'
  - name: '`WKeepAliveWrapper`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表项保活'
    dontUseFor: '不要用它做滚动回调；只负责 keepAlive'
  - name: '`WNotificationListenerBuilder`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '监听滚动通知 / 百分比'
    dontUseFor: '百分比只处理 depth 0 的 ScrollUpdateNotification'
  - name: '`WApp`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: 'GetX 启动器'
    usage: "await WApp.options(WAppOptions(title: 'Demo')).start();"
    pitfalls:
      - "WApp \u5728 w_tools_app_getx\uff0c\u4e0d\u5728 core w_tools_app"
      - "start() \u53ea\u8c03\u7528\u4e00\u6b21"
    related: ["`WAppPlugin`", "`WAppOptions`"]
    teach: true

  - name: '`WAppOptions`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'

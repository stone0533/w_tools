  - name: '`WCancelToken`'
    package: 'w_tools_async'
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '协作式取消：传给 WAsync / withToken loader'
    dontUseFor: '取消后不可复用；新请求要新建 token'
    usage: |
      final token = WCancelToken();
      final result = await WAsync.tryRun(
        () => api.fetch(cancelToken: token),
        cancelToken: token,
      );
      token.cancel('page disposed');
    pitfalls:
      - '取消是协作式的：底层 Future 不一定停，只是等待提前结束'
      - '令牌取消后不能复用'
    related: ['WAsync', 'WAsyncOptions', 'WCancellationException']
    teach: true

# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart 与 docs/modules/components.md 的 §1~§9 表格。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    docsAnchor: '7-wscaffold---增强脚手架'
    section: '1. 页面骨架与导航'
    useFor: '页面壳：默认 WAppBar、body、底部导航/FAB、安全区'
    dontUseFor: '任意顶部叠放用页面层 Container/Stack'
    usage: |
      WScaffold(
        title: '首页',
        actions: [IconButton(onPressed: ..., icon: Icon(Icons.search))],
        floatingActionButton: FloatingActionButton(onPressed: ..., child: Icon(Icons.add)),
        body: ...,
      )
      // 覆盖顶栏：WScaffold(appBar: WAppBar(...), body: ...)
    pitfalls:
      - '不要手拼 Scaffold + SafeArea；页面壳统一用 WScaffold'
      - '传 appBar 时不要再传 title/leading/actions；drawer/bottomSheet/非标准安全区才直接用 Scaffold'
    related: ['`WAppBar`', '`WNavBar`']
    teach: true
  - name: '`WAppBar`'
    package: 'w_tools_ui'
    docsAnchor: 'wappbar'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
    usage: |
      WAppBar(
        title: '详情',
        leading: BackButton(onPressed: ...),
        actions: [IconButton(onPressed: ..., icon: Icon(Icons.share))],
        bottom: PreferredSize(preferredSize: Size.fromHeight(40), child: ...),
      )
    pitfalls:
      - '单独放进页面 body 时设 includeStatusBar: false，避免重复状态栏内边距'
    related: ['`WScaffold`', '`WAppBarStyle`']
    teach: false
  - name: '`WAppBarStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wappbar'
    section: '1. 页面骨架与导航'
    useFor: 'WAppBar 的背景 / 渐变 / 前景色 / 标题样式 / 高度'
    dontUseFor: 'backgroundColor 与 gradient 只能选一个'
    usage: |
      WAppBar(
        title: '首页',
        style: WAppBarStyle(
          backgroundColor: Colors.white,
          foregroundColor: Colors.black87,
          titleStyle: TextStyle(fontWeight: FontWeight.w700),
        ),
      )
      // 渐变：WAppBarStyle(gradient: LinearGradient(colors: [...]))
    pitfalls:
      - 'backgroundColor 与 gradient 只能选一个；两者切换用 withBackground(color:) / withBackground(gradient:)'
    related: ['`WAppBar`']
    teach: false
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    docsAnchor: 'wnavbar--wnavcontroller'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏；controller 需 vsync 并由页面 State dispose'
    dontUseFor: '不要自己写 `BottomNavigationBar`'
    usage: |
      final nav = WNavController(length: 3, vsync: this); // State with TickerProviderStateMixin
      WNavBar(
        controller: nav,
        style: const WNavBarStyle(padding: EdgeInsets.symmetric(horizontal: 8)),
        itemBuilder: (context, index, selected) => ...,
      );
      
      @override
      void dispose() {
        nav.dispose();
        super.dispose();
      }
    pitfalls:
      - 'onItemTap 返回 false 可以阻止切换'
    related: ['`WNavBarStyle`', '`WTabBar`']
    teach: false
  - name: '`WNavBarStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wnavbar--wnavcontroller'
    section: '1. 页面骨架与导航'
    useFor: 'WNavBar 的外层装饰 / padding；新代码优先'
    dontUseFor: '选中态与切换动画由 `WNavController` 管，不要放进 style'
    usage: |
      WNavBar(
        controller: nav,
        style: const WNavBarStyle(padding: EdgeInsets.symmetric(horizontal: 8)),
        itemBuilder: ...,
      )
    teach: false
    related: ['`WNavBar`']
  - name: '`WTabBar`'
    package: 'w_tools_ui'
    docsAnchor: 'wtabbar'
    section: '1. 页面骨架与导航'
    useFor: '顶部 tab；依赖 TabController / DefaultTabController'
    dontUseFor: '需要下划线跟随的复杂交互时先看它够不够'
    usage: |
      DefaultTabController(
        length: 2,
        child: Column(
          children: [
            WTabBar(
              style: const WTabBarStyle(indicatorColor: Colors.indigo),
              tabs: const [Tab(text: '全部'), Tab(text: '完成')],
            ),
            Expanded(child: TabBarView(children: [...])),
          ],
        ),
      )
    pitfalls:
      - 'WTabBar 不自带 controller；外面必须有 DefaultTabController 或显式 TabController'
    related: ['`WTabBarStyle`', '`WNavBar`']
    teach: false
  - name: '`WTabBarStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wtabbar'
    section: '1. 页面骨架与导航'
    useFor: '指示器 / 分割线 / 对齐 / overlay / 标签样式；新代码优先'
    dontUseFor: 'WTabBar 不自带 controller，不要在这里塞状态'
    usage: |
      WTabBar(
        style: const WTabBarStyle(
          isScrollable: true,
          tabAlignment: TabAlignment.start,
          indicatorColor: Colors.indigo,
        ),
        tabs: const [Tab(text: '全部'), Tab(text: '完成')],
      )
    pitfalls:
      - 'tabAlignment 非默认值时必须同时设 isScrollable: true'
    related: ['`WTabBar`']
    teach: false
  - name: '`WStep` / `WStepFlow`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
    dontUseFor: '背景/高度用外层 Container；多步骤注意横向空间'
    usage: |
      WStep(labels: const ['下单', '付款', '完成'], current: 2);
      
      final flow = WStepFlow(labels: const ['下单', '付款', '完成']);
      flow.build(current: 2);
    pitfalls:
      - 'current 从 1 开始；越界 / 空 labels 会在 debug 断言'
      - 'WStepFlow 构造时复制并冻结 labels'
    related: ['`WStepStyle`']
    teach: false
  - name: '`WStepStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: '步骤条颜色 / 尺寸 / 间距 / 标签样式'
    dontUseFor: '不要靠改 WStep 内部布局实现视觉；优先用 itemBuilder'
    usage: |
      WStep(
        labels: const ['下单', '付款'],
        current: 1,
        style: const WStepStyle(currentColor: Colors.indigo, itemSize: 32),
      )
    related: ['`WStep`']
    teach: false
  - name: '`WStepColors`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: 'WStepStyle.resolve 返回的 completed / current / upcoming 颜色'
    dontUseFor: '不要自己按 Brightness 推颜色；让 WStepStyle.resolve 解析主题'
    usage: |
      final colors = style.resolve(Theme.of(context).colorScheme);
      colors.completed; colors.current; colors.upcoming;
    related: ['`WStepStyle`', '`WStep`']
    teach: false
  - name: '`WText` / `WTextVariant` / `WTextStyles`'
    package: 'w_tools_ui'
    docsAnchor: '3-wtext---文本组件'
    section: '2. 文本与图标'
    useFor: '语义文字样式、overrides、maxLines、textScaler'
    dontUseFor: '不要再用已移除的 `WTextConfig`，改用 `WTextStyles`'
    usage: |
      WText(text: '标题', variant: WTextVariant.title);
      WText(text: '正文', variant: WTextVariant.body, maxLines: 2, overflow: TextOverflow.ellipsis);
      WText(text: '价格', variant: WTextVariant.price, style: const TextStyle(fontFeatures: [FontFeature.tabularFigures()]));
      // 品牌样式装一次：ThemeData(...).withWTextStyles(WTextStyles.fromTextTheme(TextTheme))
    pitfalls:
      - '已移除 WTextConfig；样式统一 WTextStyles'
      - 'enum 只有 11 个 variant，不要自造'
    related: ['`WTextStyles`']
    teach: true
  - name: '`WImage`'
    package: 'w_tools_ui'
    docsAnchor: '4-wimage---图片组件'
    section: '2. 文本与图标'
    useFor: '网络图/资源图（缓存、占位；重试需显式设置 retryCount）'
    dontUseFor: '不要裸用 `Image.network`'
    usage: |
      WImage.source(source: WImageSource.network(url));
      WImage.source(source: WImageSource.asset('logo.png', prefix: true));
      WImage.source(source: WImageSource.parse(raw));
      WImage.source(source: WImageSource.network(url), slots: const WImageSlots(showRetryButton: true));
      WImage.source(
        source: WImageSource.network(url),
        options: const WImageLoadOptions(memCacheWidth: 800, retryCount: 2),
      );
      // 必须给 width/height/aspectRatio，或由父级约束（SizedBox/Expanded/AspectRatio）
    pitfalls:
      - '旧 WImage.network/asset/data 已在 6.0 删除'
      - '未知来源用 WImageSource.parse'
      - '没有 width/height/aspectRatio 时必须由父级约束（SizedBox/Expanded/AspectRatio）；否则 Row/Column/ListView 里加载前是 0 尺寸（空白）'
    related: ['`WImageSource`', '`WImageSlots`']
    teach: true
  - name: '`WImageSource`'
    package: 'w_tools_ui'
    docsAnchor: '4-wimage---图片组件'
    section: '2. 文本与图标'
    useFor: 'WImage 的来源：network / asset / file / base64 / provider / parse'
    dontUseFor: '不要用已删除的 WImage.network / asset / file / data'
    usage: |
      WImageSource.network(url);
      WImageSource.network(url, headers: {'Authorization': token}, cacheKey: 'avatar');
      WImageSource.asset('logo.png', prefix: true); // 默认不拼 WAssets.imagePath
      WImageSource.file(path);
      WImageSource.base64(raw);
      WImageSource.provider(MemoryImage(bytes));
      WImageSource.parse(raw); // 未知字符串
      await WImageSource.asset('logo.png').resolve(memCacheWidth: 240); // 预加载 provider
    pitfalls:
      - 'asset(name) 默认不拼 WAssets.imagePath；需要前缀时显式 prefix: true'
      - '旧 WImage.network/asset/file 已删除'
      - '未知字符串用 WImageSource.parse'
      - '预加载用 WImageSource.resolve，不要自己拼 AssetImage/CachedNetworkImageProvider'
    related: ['`WImage`']
    teach: true
  - name: '`WImageStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wimagestyle-配置'
    section: '2. 文本与图标'
    useFor: '图片视觉：尺寸 / fit / 圆角 / 边框 / 阴影 / aspectRatio / 语义'
    dontUseFor: '占位/错误 UI 用 `WImageSlots`，加载/重试用 `WImageLoadOptions`，不要混在 style 里'
    usage: |
      WImageStyle.avatar(40)
      WImageStyle.thumbnail(80)
      WImageStyle.cover(aspectRatio: 16 / 9, radius: 12)
      WImageStyle(
        width: 120,
        height: 68,
        borderRadius: BorderRadius.circular(8),
        border: Border.all(color: Colors.black12),
        boxShadow: WShadows.card,
        semanticLabel: '封面',
      )
    pitfalls:
      - 'aspectRatio 不能与固定 width/height 同时传（debug 断言）'
      - '列表缩略图用 WImageStyle.thumbnail，解码尺寸交给 WImageLoadOptions.memCache*'
    related: ['`WImage`', '`WImageLoadOptions`']
    teach: true
  - name: '`WImageLoadOptions`'
    package: 'w_tools_ui'
    docsAnchor: 'wimageloadoptions-配置'
    section: '2. 文本与图标'
    useFor: '图片加载行为：解码尺寸 / 重试 / gapless'
    dontUseFor: '视觉样式用 `WImageStyle`'
    usage: |
      const WImageLoadOptions(memCacheWidth: 480, memCacheHeight: 480, retryCount: 2)
      const WImageLoadOptions(gaplessPlayback: true)
    pitfalls:
      - 'retryCount 默认 0（不自动重试）；需要重试要显式设置'
      - '占位 / 错误 / 进度 / 重试 UI 用 `WImageSlots`，不要塞进 Options'
    related: ['`WImage`', '`WImageStyle`', '`WImageSlots`', '`WImageController`']
    teach: true
  - name: '`WImageController`'
    package: 'w_tools_ui'
    docsAnchor: '重试与手动重试'
    section: '2. 文本与图标'
    useFor: '手动重试与加载状态（retry / state）'
    dontUseFor: '一个 controller 只能绑定一张 WImage'
    usage: |
      final controller = WImageController();
      WImage.source(source: WImageSource.network(url), controller: controller);
      controller.retry();
      controller.state.addListener(() { ... }); // 初始即 idle，无需判空
      controller.dispose();
    related: ['`WImage`']
    teach: false
  - name: '`WButtonStyle`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: '按钮视觉：颜色 / 边框 / 圆角 / 内边距 / 尺寸 / 动效 / 语义'
    dontUseFor: '按钮宽度由父布局决定，`WButtonStyle` 不含 width'
    usage: |
      WButton(
        style: WButtonStyle.filled(backgroundColor: Colors.deepPurple, foregroundColor: Colors.white),
        label: '保存',
        onTap: save,
      )
    related: ['`WButton`']
  - name: '`WButton`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: '真正的按钮（label/icon + style/size/loading）'
    dontUseFor: '任意 child 点击用 `WPressable`'
    usage: |
      WButton(label: '保存', onTap: save);
      WButton(label: '提交', loading: true, enabled: false, onTap: save);
      WButton(icon: Icons.add, label: '新增', onTap: add);
      WButton(label: '详情', content: Row(mainAxisSize: MainAxisSize.min, children: [...]), onTap: ...);
    pitfalls:
      - '任意 child 点击用 WPressable，不要套 WButton'
      - '项目页面优先用 AppButtons；WButtonStyles 只用于组件示例 / 独立 Demo'
      - 'loading 时同时设 enabled: false，避免重复点击'
      - 'label 与 content 不能同时传；icon-only 要提供 semanticLabel'
    related: ['`WPressable`', '`WButtonStyles`']
    teach: true
  - name: '`WPressable`'
    package: 'w_tools_ui'
    docsAnchor: '21-wpressable---任意-child-点击'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果（无 button 语义）'
    dontUseFor: '需要 button 语义 / 键盘焦点 / 最小点击区域时用 `WButton`'
    usage: |
      WPressable(onTap: open, child: card);
      WPressable(effect: WPressEffect.scale, pressedScale: 0.98, onLongPress: ..., child: card);
    pitfalls:
      - '不设置 Semantics.button，也不处理键盘焦点；需要时显式包 Semantics 或改用 WButton'
      - 'effect 默认 opacity；需要缩放用 WPressEffect.scale'
    related: ['`WButton`']
    teach: true
  - name: '`WButtonStyles`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: '按 ColorScheme 派生的四种语义样式（primary / secondary / text / danger）'
    dontUseFor: '不要硬编码颜色；页面统一样式用项目 AppButtons 注册表'
    usage: |
      WButton(style: WButtonStyles.of(context).primary, label: '保存', onTap: save);
      // WButtonStyles.of(context).secondary / .text / .danger 同源
    related: ['`WButton`']
    teach: false
  - name: '`WButtonStyleSet`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: 'WButtonStyles.of 返回的四种语义样式集合'
    dontUseFor: '不要自己 new 这组样式；用 WButtonStyles.of(context)'
    usage: |
      final set = WButtonStyles.of(context);
      WButton(style: set.primary, label: '保存', onTap: save);
    related: ['`WButtonStyles`', '`WButton`']
    teach: false
  - name: '`WActionRow` / `WSelectableRow`'
    package: 'w_tools_ui'
    docsAnchor: 'wactionrow--wselectablerow'
    section: '3. 按钮与操作'
    useFor: '横向滚动按钮行：`WActionRow` 无选中、`WSelectableRow` 单选高亮'
    dontUseFor: '旧的 `WRowButtons` 已在 5.0 删除；纯静态排列直接用 `Row`'
    usage: |
      WActionRow(
        spacing: 8,
        onScroll: (offset) { ... },
        children: [WButton(...), WButton(...)],
      );
      WSelectableRow(
        itemCount: 4,
        selectedIndex: index,
        onSelected: (i) => setState(() => index = i),
        builder: (context, i, selected) => ...,
      );
    related: ['`WButton`']
    teach: false
  - name: '`WBadge`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标数字'
    dontUseFor: '不要用于状态点或长文案；状态点用原生 Container，多字提示用 WText'
    usage: |
      WBadge(badgeContent: const Text('3'), child: const Icon(Icons.notifications));
      WBadge(position: const WBadgePosition.center(), badgeContent: const Text('NEW'), child: ...);
      WBadge(showBadge: false, badgeContent: const Text('hidden'), child: ...);
    pitfalls:
      - 'badgeContent 为空时不渲染徽章（不报错）'
      - '默认背景 / 前景取 ColorScheme.error / onError；自定义用 style: WBadgeStyle(...)'
    related: ['`WBadgeStyle`', '`WBadgePosition`']
    teach: false
  - name: '`WBadgeStyle`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标视觉：背景 / 前景 / 文字 / padding / 圆角 / 边框'
    dontUseFor: '不要在这里放位置；位置用 WBadgePosition'
    usage: |
      WBadge(
        style: const WBadgeStyle(backgroundColor: Colors.green, foregroundColor: Colors.white),
        badgeContent: const Text('NEW'),
        child: icon,
      )
    related: ['`WBadge`', '`WBadgePosition`']
    teach: false
  - name: '`WBadgePosition`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标位置：topEnd / center'
    dontUseFor: '不要用它做外部布局；它只控制角标相对 child 的位置'
    usage: |
      WBadge(position: const WBadgePosition.topEnd(top: 2, end: 2), child: ...);
      WBadge(position: const WBadgePosition.center(), child: ...);
    related: ['`WBadge`', '`WBadgeStyle`']
    teach: false
  - name: '`WClipRRect`'
    package: 'w_tools_ui'
    docsAnchor: 'wcliprrect'
    section: '4. 布局与容器'
    useFor: '裁剪'
    dontUseFor: '不要用它替代图片圆角；图片圆角用 WImageStyle.borderRadius'
    usage: |
      WClipRRect(borderRadius: BorderRadius.circular(12), child: image);
      WClipRRect(
        borderRadius: const BorderRadius.only(topLeft: Radius.circular(24)),
        child: image,
      )
    related: ['`WImageStyle`']
    teach: false
  - name: '`WScreen`'
    package: 'w_tools_ui'
    docsAnchor: '1-wscreen---屏幕适配'
    section: '4. 布局与容器'
    useFor: '屏幕 / 字体适配（w/h/sp）、状态栏 / 底部安全区'
    dontUseFor: '不要重复用 MediaQuery 手写全局适配'
    usage: |
      final screen = WScreen.of(context);
      screen.width; screen.statusBarHeight;
      WScreen.w(16); WScreen.h(24); WScreen.sp(14);
      WScreen.delegateWidth = (v) => ScreenUtil().setWidth(v); // 可选
    pitfalls:
      - '静态 getter 读平台 view；树内 / 分屏 / 测试尺寸用 WScreen.of(context)'
      - '不要在 main / 顶层 final 调 .sp；放到 ScreenUtilInit.builder 或 WAppPlugin.builderWrapper'
    related: ['`WScaffold`']
    teach: true
  - name: '`WAssets`'
    package: 'w_tools_ui'
    docsAnchor: 'wassets'
    section: '4. 布局与容器'
    useFor: '图片资源前缀唯一开关'
    dontUseFor: '不要硬编码 `assets/images/`'
    usage: |
      WAssets.imagePath = 'assets/images/';
      'logo.png'.assetImagePath;
    pitfalls:
      - 'setter 自动补末尾 /；空字符串表示不添加前缀'
    related: ['`WImageSource`']
    teach: false
  - name: '`WForm`'
    package: 'w_tools_form'
    docsAnchor: '36-直接字段与-wform'
    section: '5. 字段组件（直接用法 / 低层细节）'
    useFor: '页面表单容器：主题 / Scope / 只读 / 默认字段样式 / 默认校验'
    dontUseFor: '普通页面不要手写 `WFormTheme + WFormScope + WFormReadOnlyScope` 三层嵌套；App 级图标 / 边框才用外层 `WFormTheme`'
    usage: |
      WForm(
        controller: form,
        child: WFormTextField(name: 'email', hintText: '邮箱'),
      )

    usage: |
      final activity = WAsyncActivity(onStart: ..., onEnd: ...);
      final options = WAsyncOptions(activity: activity, onError: (e) => log(e));
      await WAsync.run(() => api.fetch(), options: options);
    pitfalls:
      - 'Controller 只接 onError，不接 WAsyncOptions'
      - '调用点自己处理错误时用 withoutOnError()，避免重复上报'
    related: ['WAsync', 'WAsyncActivity', 'WCancelToken']

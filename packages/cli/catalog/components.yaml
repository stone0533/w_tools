# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart 与 docs/modules/components.md 的 §1~§9 表格。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '页面壳：默认 WAppBar、body、底部导航/FAB、安全区'
    dontUseFor: '任意顶部叠放用页面层 Container/Stack'
  - name: '`WAppBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏；controller 需 vsync 并由页面 State dispose'
    dontUseFor: '不要自己写 `BottomNavigationBar`'
  - name: '`WTabBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '顶部 tab；依赖 TabController / DefaultTabController'
    dontUseFor: '需要下划线跟随的复杂交互时先看它够不够'
  - name: '`WStep` / `WStepFlow`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
    dontUseFor: '背景/高度用外层 Container；多步骤注意横向空间'
  - name: '`WText` / `WTextVariant` / `WTextStyles`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '语义文字样式、overrides、maxLines、textScaler'
    dontUseFor: '不要再用 `WTextConfig`；已移除，使用 `WTextStyles`'
  - name: '`WImage`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '网络图/资源图（缓存、重试、占位）'
    dontUseFor: '不要裸用 `Image.network`'
  - name: '`WButton`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '真正的按钮（label/icon + style/size/loading）'
    dontUseFor: '任意 child 点击用 `WPressable`'
  - name: '`WPressable`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果（无 button 语义）'
    dontUseFor: '需要 button 语义时用 `WButton`'
  - name: '`WActionRow` / `WSelectableRow`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '横向滚动按钮行：`WActionRow` 无选中、`WSelectableRow` 单选高亮'
    dontUseFor: '旧的 `WRowButtons` 已在 5.0 删除；纯静态排列直接用 `Row`'
  - name: '`WBadge`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '角标数字'
  - name: '`WClipRRect`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '裁剪'
  - name: '`WScreen`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '屏幕 / 字体适配（w/h/sp）、状态栏 / 底部安全区'
    dontUseFor: '不要重复用 MediaQuery 手写全局适配'
  - name: '`WAssets`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '图片资源前缀唯一开关'
    dontUseFor: '不要硬编码 `assets/images/`'
  - name: '`WForm`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面表单容器：主题 / Scope / 只读 / 默认字段样式 / 默认校验'
    dontUseFor: '不要手写 `WFormTheme + WFormScope + WFormReadOnlyScope`'
  - name: '`WFormController`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '表单数据 / 字段值 / 校验入口'
    dontUseFor: '多个 WForm 不要共用一个 controller'
  - name: '`WFormTextField`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接文本 / 密码字段（label / message / validator）'
    dontUseFor: '不要默认写 `WFormTextFieldConfig().build(...)`'
  - name: '`WFormDropdown` / `WFormMultiDropdown`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接下拉 / 多选字段'
    dontUseFor: '选择类弹层用 `WFormPopup`'
  - name: '`WFormDatePicker` / `WFormCheckbox` / `WFormRadioGroup`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接日期 / 复选 / 单选字段'
  - name: '`WFormButton`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接自定义字段按钮（选择、弹层触发）'
    dontUseFor: '普通业务按钮用 `WButton`；底层 `*Core` 已内部化，不要直接使用'
  - name: '`WFormFieldStyle`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面级字段默认高度 / 内边距 / 文字 / hint 样式'
    dontUseFor: '字段特殊样式用字段 `config` 覆盖'
  - name: '`WFormValidatorSettings`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '校验行为：边框错误、短路 / 全量、回调'
  - name: '`WFormBorder`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '低层边框 / 错误展示；普通页面由 `WForm` 统一提供'
    dontUseFor: '普通字段不要手写 `WFormBorder`'
  - name: '`WBottomSheet`'
    package: 'w_tools_app_getx'
    section: '6. 弹层'
    useFor: '底部面板外壳'
  - name: '`WFormPopup`'
    package: 'w_tools_form'
    section: '6. 弹层'
    useFor: '**锚定式**下拉弹层（贴在输入框下方）'
    dontUseFor: '⚠️ 它不是居中对话框，别拿来做「确认弹窗」'
  - name: '`WAsyncView` / `WAsyncErrorView` / `WAsyncErrorBanner`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '普通页面异步四态视图、默认重试页与刷新错误条'
    dontUseFor: '滚动页面用 `WAsyncStateBuilder`；纯状态逻辑用 `WAsyncState` / `WAsyncController`'
  - name: '`WAsyncStateBuilder`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '滚动页面 / `SmartRefresher` / 自定义状态布局'
    dontUseFor: '普通页面优先用 `WAsyncView`；旧 `WAsyncBuilder` 已删除'
  - name: '`WAsyncController`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '单区块异步状态、load / retry / 旧请求丢弃'
    dontUseFor: '分页用 `WAsyncPagedController`；纯执行用 `WAsync`'
  - name: '`WAsyncPagedController`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '分页列表：首屏、刷新、追加、hasMore（recipe: docs/recipes/paged-list.md）'
    dontUseFor: '普通单请求用 `WAsyncController`'
  - name: '`WAsyncStateSliver`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'CustomScrollView 的四态 sliver、failed+旧数据'
    dontUseFor: '非滚动页面用 `WAsyncView`'
  - name: '`WAsyncTheme`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'App 根部统一默认 loading / empty / error（普通 + sliver）'
    dontUseFor: '不要用它包装单个页面；单个 WAsyncView 的显式 builder 优先'
  - name: '`WToast`'
    package: 'w_tools_toast'
    section: '7. 状态与反馈'
    useFor: '轻提示'
  - name: '`WGradientCircularProgressIndicator`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '加载指示'
  - name: '`WListView` / `WListViewSliver`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表（独立滚动 / SmartRefresher sliver）'
  - name: '`WKeepAliveWrapper`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表项保活'
    dontUseFor: '不要用它做滚动回调；只负责 keepAlive'
  - name: '`WNotificationListenerBuilder`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '监听滚动通知 / 百分比'
    dontUseFor: '百分比只处理 depth 0 的 ScrollUpdateNotification'
  - name: '`WApp`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: 'GetX 启动器'
  - name: '`WAppPlugin`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '插件分层初始化'
  - name: '`WAsyncState`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '四态快照与 `when`'
    dontUseFor: '不要手写 `ValueNotifier<WAsyncState>`'
  - name: '`WAsync` / `WAsyncOptions` / `WAsyncActivity` / `WCancelToken`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '无 UI 状态的异步执行、并发 loading 合并、取消'
  - name: '`WCountdown`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '倒计时'
  - name: '`WStorage`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '本地类型读写'
    dontUseFor: '读取前必须 `init`；明文存储'
  - name: '`WToken`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: 'token 存取'
    dontUseFor: '明文存储；高敏感场景用 Keychain / Keystore'
  - name: '`WEncrypt` / `WHash`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '加密、摘要'
    dontUseFor: 'AES-CBC 不提供完整性'
  - name: '`WLogger` / `WValidator` / `WRegExp`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '日志、校验、正则'
  - name: '`WDebounce` / `WThrottle`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '防抖 / 节流（`WUx` 的同名方法已弃用）'
    dontUseFor: '不要每次 build 新建实例；页面 dispose 时 cancel'
  - name: '`WPlatform`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '平台判断'
    dontUseFor: '不要用 Platform.isXxx 绕过统一判断'
  - name: '`DioRegistry`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '按 baseUrl 创建并复用 Dio'
    dontUseFor: '不要直接 `Dio()`；同一 baseUrl 只配置一次'
  - name: '`WTokenInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: 'Token 注入 / 401 刷新 / 重试（recipe: docs/recipes/login-refresh.md）'
    dontUseFor: '不要在拦截器里存 token'
  - name: '`WLogInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求 / 响应 / 错误日志'
    dontUseFor: '不做业务错误处理；敏感头默认脱敏'
  - name: '`WApiConfig`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求配置与日志注入'
  - name: '`WLanguage`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: '语言切换 / `languageStream`'
    dontUseFor: '不要直接改 `WAppConfig.currentLanguage` 后期待通知'
  - name: '`WAppConfig`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: '语言列表与当前语言真源'
    dontUseFor: '非响应式；切换用 `WLanguage`'
  - name: '`WRouteObserver`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: '维护 `WRouteStack` 路由栈'
    dontUseFor: '不要重复添加；WApp 已自动追加'
  - name: '`WQrView`'
    package: 'w_tools_qr'
    section: '8. 能力（非 UI）'
    useFor: '二维码 / 条形码扫描'
    dontUseFor: '不要直接用 `QRView`；单次扫码后用 `restartScan`'
  - name: '`WQrController`'
    package: 'w_tools_qr'
    section: '8. 能力（非 UI）'
    useFor: '相机控制与广播扫描流'
    dontUseFor: '不要用它重置 scanOnce'
  - name: '`WQrViewOverlayShape`'
    package: 'w_tools_qr'
    section: '8. 能力（非 UI）'
    useFor: '扫描框样式'
    dontUseFor: '尺寸必须大于 0'
  - name: '`WMap` / `WMapZone`'
    package: 'w_tools_map_google'
    section: '8. 能力（非 UI）'
    useFor: 'Google Maps 地图与数据区域'
    dontUseFor: '不要直接用 `GoogleMap`；需要 API Key'
  - name: '`WMapController`'
    package: 'w_tools_map_google'
    section: '8. 能力（非 UI）'
    useFor: '业务侧选中 / 关闭 marker'
    dontUseFor: '未挂载时无效果'
  - name: '`WMapItemMapper`'
    package: 'w_tools_map'
    section: '8. 能力（非 UI）'
    useFor: '生成模型取地图字段'
    dontUseFor: '不要在 build 内重复创建'
  - name: '`WRouteStack`'
    package: 'w_tools_app_getx'
    section: '8. 能力（非 UI）'
    useFor: '路由栈操作（`WRouteStack.defaultStack` / `app.routeStack`）'
  - name: '`WNumExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: '数字格式化 / 间距 / 圆角 / BorderSide 糖'
    dontUseFor: '不要重复手写 toStringAsFixed / SizedBox / EdgeInsets'
  - name: '`WStringExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'String 转数字 / 去空格 / hex 颜色 / 资源路径'
    dontUseFor: '图片组件转换用 `WStringExtension` 的路径方法'
  - name: '`WBoxDecorationExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'BoxDecoration 组合（颜色 / 边框 / 圆角 / 阴影）'
    dontUseFor: '不要每次重写完整 BoxDecoration'
  - name: '`WWidgetExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'Widget 间距 / 安全空间 / 装饰 / IntrinsicHeight'
    dontUseFor: '需要 button 语义用 `WButton`'
  - name: '`WUiWidgetExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: '`toPressable`（任意 child 点击，无 button 语义）'
    dontUseFor: '需要 button 语义用 `WButton`'
  - name: '`WHexColor`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: '十六进制颜色解析 / 输出'
    dontUseFor: '不要手写 Color(int.parse(...))'

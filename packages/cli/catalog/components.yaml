  - name: '`WTokenInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: 'Token 注入 / 401 刷新 / 重试（可运行示例：packages/api/example）'
    dontUseFor: '不要在拦截器里存 token'
    usage: |
      final tokenInterceptor = WTokenInterceptor(
        tokenGetter: () => token,
        tokenClearer: clearToken,
        tokenRefresher: refreshToken,
      );
    pitfalls:
      - "tokenRefresher 必须自己持久化新 token，否则 tokenGetter 仍返回旧值"
      - "tokenRefresher 返回 null / 空串 / 纯空白都算刷新失败：清 token、调 onAuthFailure、不重试"
      - "tokenGetter 的空串 / 纯空白不会注入 Authorization；token 写入请求头前会 trim"
      - "显式 Authorization（自己设置的头）的 401 不清理 / 不刷新 / 不重试；需要自动刷新就让拦截器注入 token"
      - "裸 Dio 需构造传 `dio:`；推荐走 `DioRegistry` 自动绑定"
      - "`DioRegistry.dispose` 后不要复用同一拦截器实例"
      - "登录 / 刷新 / 公开接口用 `shouldRefresh` 跳过自动刷新"
    related: ["`DioRegistry`", "`WApiSettings`"]
    teach: true

  - name: '`WLogInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'

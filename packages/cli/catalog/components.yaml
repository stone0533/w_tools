    usage: |
      final activity = WAsyncActivity(
        onStart: () => setState(() => _loading = true),
        onEnd: () => setState(() => _loading = false),
      );
      await WAsync.parallel(
        [loadConfig(), loadProfile()],
        options: WAsyncOptions(activity: activity),
      );
    pitfalls:
      - 'begin / end 是框架内部使用，业务不要直接调'
      - '只在 WAsync 直接执行时生效；Controller 不接受 activity'
    related: ['WAsync', 'WAsyncOptions']

    dontUseFor: '不做业务错误处理；敏感头 / 敏感 body 默认脱敏，但仍不要打进生产日志'
    usage: "final log = WLogInterceptor(parts: {WLogPart.request, WLogPart.error});"
    pitfalls:
      - "默认不打印 request / response body；需要时显式加 `requestBody` / `responseBody`，并用 `kDebugMode` 控制"
      - "想记录注入后的 Authorization，要放在 `WTokenInterceptor` 之后；默认 `requestHeader` 是开的"
      - "`requestBody` / `responseBody` 会按 `sensitiveBodyKeys` 递归脱敏（Map / List / JSON 字符串 / FormData fields）；任意对象的 toString 不保证脱敏"
      - "只做日志，不做业务错误处理"
      - "`sensitiveBodyKeys` / `sensitiveQueryKeys` / `redactedHeaders` 会与内置集合合并"
      - "`enableLog` 已弃用（7.0 删除）；用 `parts: {}` 或不注入日志回调"
    related: ["`WLogPart`", "`WApiSettings`"]
    teach: true


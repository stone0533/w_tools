  - name: '`WRetryInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '可选的幂等请求重试（GET / HEAD / PUT / DELETE / OPTIONS）'
    dontUseFor: '不要默认开启；不要对 POST / PATCH 重试（可能重复提交）'
    usage: |
      final registry = DioRegistry.forBaseUrl(
        'https://api.example.com',
        interceptors: [
          WTokenInterceptor(...),
          WRetryInterceptor(maxRetries: 2),
        ],
      );
    pitfalls:
      - "默认不重试 401 / 4xx / 取消；401 交给 WTokenInterceptor"
      - "状态码只重试 408 / 429 / 500 / 502 / 503 / 504；其他 5xx 用 retryOnStatusCodes 放行"
      - "`unknown` 默认不重试；需要放行时用 `shouldRetry`"
      - "裸 Dio 必须构造传 `dio:`，否则只会在错误时静默放弃重试"
      - "单条请求关闭重试：`client.get(..., options: Options(extra: {WRetryInterceptor.disableRetryExtraKey: true}))`"
      - "maxRetries 是重试次数，不含首次请求；maxRetries: 2 表示最多 3 次请求"
      - "HTTP 缓存 / 离线不在本包范围，用 dio_cache_interceptor 等外部方案"

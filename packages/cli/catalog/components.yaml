# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart（tool/gen_catalog.dart）。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '页面容器：背景色、状态栏样式、底部安全区'
    dontUseFor: '不要在页面里再手写 `Scaffold` 包一层'
  - name: '`WAppBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏；WNavController 需要 vsync，页面 State 创建并 dispose'
    dontUseFor: '不要自己写 `BottomNavigationBar`；不要忘记 controller.dispose'
  - name: '`WTabBar`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '顶部 tab'
    dontUseFor: '需要 TabController / DefaultTabController，WTabBar 不自带 controller；需要下划线跟随的复杂交互时先看它够不够'
  - name: '`WStep`'
    package: 'w_tools_ui'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
  - name: '`WText` / `WTextVariant` / `WTextStyles`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '语义文字样式、overrides、maxLines、textScaler'
    dontUseFor: '不要逐字段拼样式；WTextConfig 已移除，使用 WTextStyles'
  - name: '`WImage`'
    package: 'w_tools_ui'
    section: '2. 文本与图标'
    useFor: '网络图/资源图（缓存、重试、占位）'
    dontUseFor: '不要裸用 `Image.network`'
  - name: '`WButton`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '真正的按钮（label/icon + style/size/loading）'
    dontUseFor: '任意 child 点击用 `WPressable`；表单按钮用 `WFormButton`'
  - name: '`WPressable`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果'
    dontUseFor: '需要 button 语义时用 `WButton`'
  - name: '`WRowButtons`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '一行多个按钮'
  - name: '`WBadge`'
    package: 'w_tools_ui'
    section: '3. 按钮与操作'
    useFor: '角标数字'
  - name: '`WRow` / `WColumn` / `WPadding` / `WSizeBox`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '常用布局糖'
  - name: '`WClipRRect`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '裁剪'
  - name: '`WForm`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面表单容器：主题 / Scope / 只读 / 默认字段样式 / 默认校验'
    dontUseFor: '不要手写 `WFormTheme + WFormScope + WFormReadOnlyScope`'
  - name: '`WFormController`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: 'WForm 的数据、字段值读写与校验入口'
    dontUseFor: '不要让多个 WForm 共用同一个 controller；WForm 与 controller 一对一'
  - name: '`WFormTextField`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接文本 / 密码字段（label / message / validator）'
    dontUseFor: '不要默认写 `WFormTextFieldConfig().build(...)`'
  - name: '`WFormDropdown` / `WFormMultiDropdown`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接下拉 / 多选字段'
    dontUseFor: '选择类弹层用 `WFormPopup`'
  - name: '`WFormDatePicker` / `WFormCheckbox` / `WFormRadioGroup`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接日期 / 复选 / 单选字段'
  - name: '`WFormButton`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '直接自定义字段按钮（选择、弹层触发）'
    dontUseFor: '普通业务按钮用 `WButton`；底层用 `WFormFieldButtonCore`'
  - name: '`WFormFieldStyle`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '页面级字段默认高度 / 内边距 / 文字 / hint 样式'
    dontUseFor: '字段特殊样式用字段 `config` 覆盖'
  - name: '`WFormValidatorSettings`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '校验行为：边框错误、短路 / 全量、回调'
  - name: '`WFormBorder`'
    package: 'w_tools_form'
    section: '5. 表单'
    useFor: '低层边框 / 错误展示；普通页面由 `WForm` 统一提供'
    dontUseFor: '普通字段不要手写 `WFormBorder`'
  - name: '`WBottomSheet`'
    package: 'w_tools_app'
    section: '6. 弹层'
    useFor: '底部面板外壳'
  - name: '`WFormPopup`'
    package: 'w_tools_form'
    section: '6. 弹层'
    useFor: '**锚定式**下拉弹层（贴在输入框下方）'
    dontUseFor: '⚠️ 它不是居中对话框，别拿来做「确认弹窗」'
  - name: '`WToast`'
    package: 'w_tools_toast'
    section: '7. 状态与反馈'
    useFor: '轻提示'
  - name: '`WGradientCircularProgressIndicator`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '加载指示'
  - name: '`WAsyncView` / `WAsyncErrorView` / `WAsyncErrorBanner`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '普通页面异步四态视图与默认重试视图'
    dontUseFor: '纯状态逻辑用 `WAsyncState` / `WAsyncController`；滚动页面用 `WAsyncStateBuilder`，不要把 `SmartRefresher` 包在 `WAsyncView` 外面'
  - name: '`WAsyncStateBuilder` / `WAsyncBuilder`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: '滚动页面、SmartRefresher、CustomScrollView、自定义状态布局'
    dontUseFor: '普通页面区块优先用 `WAsyncView`；不要在外层用 if 切换滚动壳，loading/empty/error 必须作为 slivers 分支'
  - name: '`WAsyncStateSliver`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'CustomScrollView 的四态 sliver、failed+旧数据'
    dontUseFor: '非滚动页面用 `WAsyncView`；readySliverBuilder 必须返回 sliver；默认不额外显示刷新进度'
  - name: '`WAsyncSliverDefaults`'
    package: 'w_tools_async'
    section: '7. 状态与反馈'
    useFor: 'WAsyncStateSliver 的全局默认 loading/empty/error/banner'
    dontUseFor: '不要复用 `WAsyncViewDefaults`；状态 builder 必须是非滚动 Widget'
  - name: '`WAsyncController`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '单区块异步状态：load / retry / state / 旧请求丢弃'
    dontUseFor: '分页用 `WAsyncPagedController`；纯执行用 `WAsync`'
  - name: '`WAsyncState`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '四态快照：loading / ready / empty / failed + when'
    dontUseFor: '不要手写 `ValueNotifier<WAsyncState>`'
  - name: '`WAsyncPagedController`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '分页列表：首屏、刷新、追加、hasMore'
    dontUseFor: '普通单请求用 `WAsyncController`'
  - name: '`WListView` / `WListViewSliver`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表（分页、下拉刷新）'
  - name: '`WKeepAliveWrapper`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '列表项保活'
    dontUseFor: '不要用它做滚动回调；只负责 keepAlive'
  - name: '`WNotificationListenerBuilder`'
    package: 'w_tools_ui'
    section: '7. 状态与反馈'
    useFor: '监听滚动通知 / 百分比'
    dontUseFor: '百分比只处理 depth 0 的 ScrollUpdateNotification'
  - name: '`WApp` / `WAppPlugin`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '启动器与插件分层初始化'
  - name: '`WAsync` / `WCancelToken`'
    package: 'w_tools_async'
    section: '8. 能力（非 UI）'
    useFor: '异步执行与取消'
  - name: '`WStorage`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: 'SharedPreferences 类型读写；读取前必须 init'
    dontUseFor: '明文存储，不要保存高敏感数据'
  - name: '`WToken`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: 'token / refresh token / 过期时间存取'
    dontUseFor: '基于 SharedPreferences 明文存储，高敏感场景用 Keychain / Keystore'
  - name: '`WUx`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '防抖 / 节流 / 延迟 / 下一帧 / 平滑滚动'
    dontUseFor: 'duration 必须为非负毫秒数'
  - name: '`WPlatform`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '平台判断与按平台取值 / 执行'
    dontUseFor: '不要用 Platform.isXxx 绕过统一判断'
  - name: '`WCountdown`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '倒计时'
  - name: '`WEncrypt` / `WHash`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '存储、令牌、加密、摘要'
  - name: '`WLogger` / `WValidator` / `WRegExp`'
    package: 'w_tools_core'
    section: '8. 能力（非 UI）'
    useFor: '日志、校验、正则'
  - name: '`DioRegistry`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '按 baseUrl 创建并复用 Dio；dispose / clearCache'
    dontUseFor: '不要直接 `Dio()`；同一 baseUrl 只初始化一次'
  - name: '`WTokenInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: 'Token 注入、401 清除 / 刷新 / 重试'
    dontUseFor: '不要在这里存 token；存储交给 `w_tools_core` 的 `WToken`'
  - name: '`WLogInterceptor`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求 / 响应 / 错误日志；默认脱敏敏感头'
    dontUseFor: '不要依赖它做业务错误处理'
  - name: '`WApiConfig`'
    package: 'w_tools_api'
    section: '8. 能力（非 UI）'
    useFor: '请求配置与日志注入'
  - name: '`WLanguage`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '语言切换、当前语言与 languageStream'
    dontUseFor: '不要直接改 WAppConfig.currentLanguage 后期待 UI 通知'
  - name: '`WAppConfig`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '语言列表与 currentLanguage 唯一真源'
    dontUseFor: '它不是响应式的；切换语言用 `WLanguage.changeLanguage`'
  - name: '`WRouteObserver`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '维护 WRoute 路由栈（WApp 自动追加）'
    dontUseFor: '不要重复添加到 navigatorObservers'
  - name: '`WRoute`'
    package: 'w_tools_app'
    section: '8. 能力（非 UI）'
    useFor: '路由工具'
  - name: '`WNumExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: '数字格式化 / 间距 / 圆角 / BorderSide 糖'
    dontUseFor: '不要重复手写 toStringAsFixed / SizedBox / EdgeInsets'
  - name: '`WStringExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'String 转数字 / 去空格 / hex 颜色 / 资源路径'
    dontUseFor: '图片组件转换用 `WUiStringExtension`'
  - name: '`WBoxDecorationExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'BoxDecoration 组合（颜色 / 边框 / 圆角 / 阴影）'
    dontUseFor: '不要每次重写完整 BoxDecoration'
  - name: '`WWidgetExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'Widget 间距 / 安全空间 / 装饰 / IntrinsicHeight'
    dontUseFor: '需要 button 语义用 `WButton`'
  - name: '`HexColor`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: '十六进制颜色解析 / 输出'
    dontUseFor: '不要手写 Color(int.parse(...))'
  - name: '`WUiWidgetExtension`'
    package: 'w_tools_ui'
    section: '9. 扩展'
    useFor: 'toPressable：任意 child 点击，无 button 语义'
    dontUseFor: '需要 button 语义用 `WButton`'
  - name: '`WScreen`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '屏幕 / 字体适配（w/h/sp）、状态栏 / 底部安全区'
    dontUseFor: '不要重复用 MediaQuery 手写全局适配'
  - name: '`WAssets`'
    package: 'w_tools_ui'
    section: '4. 布局与容器'
    useFor: '图片资源前缀唯一开关'
    dontUseFor: '不要硬编码 `assets/images/`'


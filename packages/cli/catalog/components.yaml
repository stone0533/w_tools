      - 'dependsOn 必须引用已注册插件；循环依赖会抛 StateError'
      - '插件列表构造时确定；没有 addPlugin / removePlugin'
    related: ['`WAppPlugin`', '`WApp`']
    teach: true
  - name: '`WAsyncState`'
    package: 'w_tools_async'
    docsAnchor: '2-wasyncstate'
    section: '2. WAsyncState'
    useFor: '四态快照与 `when`'
    dontUseFor: '不要手写 `ValueNotifier<WAsyncState>`'
    usage: |
      state.when(loading: ..., ready: ..., empty: ..., failed: ...);
      state.status; state.data; state.error;
      WAsyncState.list(items); // null / 空列表 → empty
    pitfalls:
      - '不要手写 ValueNotifier<WAsyncState>'
      - 'ready([]) 不等于 empty；集合空值用 empty / WAsyncState.list'
      - 'isRefreshing 依赖 data != null；nullable T 的 previousData: null 不视为刷新'
      - 'failed 只保存 error，不保存 StackTrace；堆栈走 WAsyncFailure / loader'
    related: ['WAsyncController']
    teach: true
  - name: '`WAsyncResult`'
    package: 'w_tools_async'
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '`WAsync.tryRun` 的成功 / 失败 / 取消结果'
    dontUseFor: '需要失败抛异常时用 `WAsync.run`'
    usage: |
      switch (result) {
        case WAsyncSuccess(:final value): use(value);
        case WAsyncFailure(:final error, :final stackTrace): log(error, stackTrace);
        case WAsyncCancelled(:final reason): log(reason);
      }
    pitfalls:
      - '需要失败抛异常时用 WAsync.run'
      - 'isProgrammingError 只存在于 WAsyncFailure'
    related: ['WAsync', 'WAsyncController']
    teach: true
  - name: '`WAsyncHooks`'
    package: 'w_tools_async'
    tier: core
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '执行入口的生命周期回调值对象：onStart / onError / onFinally'
    dontUseFor: '不要在这里放 loading / toast 实现；用 WAsyncExecutor 携带默认值'
    usage: |
      final hooks = WAsyncHooks(
        onStart: AppLoading.show,
        onError: AppToast.error,
        onFinally: AppLoading.hide,
      );
      final appAsync = WAsyncExecutor(hooks);
      await appAsync.run(() => api.save());
    pitfalls:
      - 'WAsyncHooks 只是回调值对象，不持有执行逻辑'
      - '默认 hooks 由 WAsyncExecutor 携带，没有全局默认 hooks'
      - 'WAsyncHooks.none 可关闭本次 hooks'
      - 'WAsyncExecutor 的 disableOnError 只关闭默认 onError，保留 onStart / onFinally'
      - '进入时已取消的 token 不触发 onStart / onError / onFinally'
    related: ['WAsyncExecutor', 'WAsync']
    teach: true

  - name: '`WAsyncExecutor`'
    package: 'w_tools_async'
    tier: core
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '携带默认 WAsyncHooks 的实例执行器：run / tryRun / retry / timeout / tryAll'
    dontUseFor: '不要做成全局单例；在 composition root 创建并注入；controller 不使用它'
    usage: |
      final appAsync = WAsyncExecutor(
        WAsyncHooks(
          onStart: AppLoading.show,
          onError: AppToast.error,
          onFinally: AppLoading.hide,
        ),
      );
      await appAsync.run(() => api.save());
      final result = await appAsync.tryRun(() => api.fetch());
      await appAsync.tryRun(task, disableOnError: true); // 只关默认 onError
    pitfalls:
      - '单次用 hooks 覆盖默认；WAsyncHooks.none 关闭本次'
      - '不要放进全局静态；按 app / 模块注入'
      - 'WAsyncController / WAsyncPagedController 不使用 executor'
      - 'pre-cancelled token 不触发 hooks；onError 不带 StackTrace'
      - 'disableOnError 不关闭显式 onError 参数；explicit 仍优先'
    related: ['WAsyncHooks', 'WAsync']
    teach: true

  - name: '`WAsync`'
    package: 'w_tools_async'
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '无 UI 异步执行（tryRun / run / retry / timeout / tryAll）'
    dontUseFor: '页面四态用 `WAsyncController` + `WAsyncView`；并发组合用 Future.wait / package:async'
    usage: |
      final appAsync = WAsyncExecutor(
        WAsyncHooks(
          onStart: AppLoading.show,
          onError: AppToast.error,
          onFinally: AppLoading.hide,
        ),
      );
      final result = await appAsync.tryRun(() => api.fetch());
      switch (result) {
        case WAsyncSuccess(:final value): use(value);
        case WAsyncFailure(:final error): log(error);
        case WAsyncCancelled(): log('cancelled');
      }
      final value = await WAsync.run(
        () => api.fetch(),
        onStart: showLoading,
        onError: showError,
        onFinally: hideLoading,
      );
      await WAsync.retry(
        () => api.submit(),
        onStart: showLoading,
        onError: showError,
        onFinally: hideLoading,
        retryCount: 3,
        retryDelayBuilder: (attempt) => Duration(milliseconds: 200 * (1 << (attempt - 1))),
      );
      await WAsync.tryAll(
        [() => api.banners(), () => api.columns()],
        onStart: showLoading,
        onError: showError,
        onFinally: hideLoading,
      );
    pitfalls:
      - 'run 失败抛异常；tryRun 不抛异常'
      - 'onStart / onFinally 管 loading；onFinally 在成功 / 失败 / 取消都执行'
      - '默认 hooks 配置在 WAsyncExecutor；显式回调 > hooks > executor 默认'
      - '本次关闭 hooks 传 WAsyncHooks.none；没有全局 defaultHooks 可重置'
      - 'retry / timeout 的钩子整次一次；tryAll 是 batch-level，整批一次'
      - '成功用返回值，不提供 onSuccess；onError 只是通知，不会吞异常'
      - 'run().then(onSuccess) 必须带 onError/catchError，或改用 tryRun'
      - 'tryAll 保留每个结果；失败任务逐个通知 onError；settle 已 deprecated，9.0 删除'
      - '取消需要 WCancelToken；取消不中止底层 Future；取消与失败同轮时非 Error 按取消处理'
      - 'retry 的 retryCount 是重试次数（总尝试 = retryCount + 1）；onRetry 自身异常被忽略'
      - 'pre-cancelled token 不触发 hooks；retryIf / retryDelayBuilder 抛错按最终失败'
      - 'timeout 只结束等待，不取消底层 Future；取消要传 cancelToken'
    related: ['WAsyncResult', 'WCancelToken']
    aliases: ['tryRun', 'run', 'retry', 'timeout', 'tryAll', 'settle']
    teach: true

  - name: '`WCancelToken`'
    package: 'w_tools_async'
    docsAnchor: '1-wasync'
    section: '1. WAsync'
    useFor: '协作式取消：传给 WAsync 或 Controller 的 loader'
    dontUseFor: '取消后不可复用；新请求要新建 token'
    usage: |
      final token = WCancelToken();
      final result = await WAsync.tryRun(
        () => api.fetch(cancelToken: token),
        cancelToken: token,
      );
      token.cancel('page disposed');
    pitfalls:
      - '取消是协作式的：底层 Future 不一定停，只是等待提前结束'
      - '令牌取消后不能复用'
    related: ['WAsync', 'WCancellationException']
    teach: true


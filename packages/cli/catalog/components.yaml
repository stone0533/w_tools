# 组件目录的唯一来源：生成 lib/src/catalog/catalog.g.dart 与 docs/modules/components.md 的 §1~§9 表格。
# 字段：name / package / section / useFor / dontUseFor。import 与文档路径由生成器推导。
version: 1
components:
  - name: '`WScaffold`'
    package: 'w_tools_ui'
    docsAnchor: '7-wscaffold---增强脚手架'
    section: '1. 页面骨架与导航'
    useFor: '页面壳：显式 WAppBar / 任意 appBar、body、抽屉 / 底部面板 / 底部导航 / FAB、安全区'
    dontUseFor: '任意顶部叠放用页面层 Container/Stack'
    usage: |
      WScaffold(
        appBar: WAppBar(
          title: '首页',
          actions: [IconButton(onPressed: ..., icon: Icon(Icons.search))],
        ),
        floatingActionButton: FloatingActionButton(onPressed: ..., child: Icon(Icons.add)),
        drawer: Drawer(...),
        bottomSheet: ...,
        bottomNavigationBar: WNavBar(...), // WNavBar 自带 SafeArea
        body: ...,
      )
      // 非 WNavBar 底栏：WScaffold(bottomNavigationBarSafeArea: true, ...)
    pitfalls:
      - '不要手拼 Scaffold + SafeArea；页面壳统一用 WScaffold'
      - '顶栏统一显式传 appBar: WAppBar(...)；13.0 删除了 WScaffold.basic'
      - 'drawer / endDrawer / bottomSheet / persistentFooterButtons / extendBody 已透传，不需要为此改用原生 Scaffold'
      - '有 bottomNavigationBar 时 WScaffold 不再给 body 加底部安全区；底栏不是 WNavBar（已默认 SafeArea）时传 bottomNavigationBarSafeArea: true'
    related: ['`WAppBar`', '`WNavBar`']
    teach: true
  - name: '`WAppBar`'
    package: 'w_tools_ui'
    docsAnchor: 'wappbar'
    section: '1. 页面骨架与导航'
    useFor: '标准顶部导航栏（leading/title/actions/bottom、leadingWidth/actionsPadding/shadow）'
    dontUseFor: '任意叠放/覆盖布局在页面层用 Container/Stack'
    usage: |
      WAppBar(
        title: '详情',
        leading: BackButton(onPressed: ...),
        actions: [IconButton(onPressed: ..., icon: Icon(Icons.share))],
        bottom: PreferredSize(preferredSize: Size.fromHeight(40), child: ...),
        style: const WAppBarStyle(
          leadingWidth: 72,
          actionsPadding: EdgeInsets.only(right: 8),
          boxShadow: [BoxShadow(color: Color(0x33000000), blurRadius: 4)],
        ),
      )
    pitfalls:
      - '单独放进页面 body 时设 includeStatusBar: false，避免重复状态栏内边距'
      - '自绘顶栏没有 Material elevation；需要阴影时用 WAppBarStyle.boxShadow'
    related: ['`WScaffold`', '`WAppBarStyle`']
    teach: false
  - name: '`WAppBarStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wappbar'
    section: '1. 页面骨架与导航'
    useFor: 'WAppBar 的背景 / 渐变 / 前景色 / 标题样式 / 高度 / leadingWidth / actionsPadding / 阴影'
    dontUseFor: 'backgroundColor 与 gradient 只能选一个'
    usage: |
      WAppBar(
        title: '首页',
        style: WAppBarStyle(
          backgroundColor: Colors.white,
          foregroundColor: Colors.black87,
          titleStyle: TextStyle(fontWeight: FontWeight.w700),
        ),
      )
      // 渐变：WAppBarStyle(gradient: LinearGradient(colors: [...]))
    pitfalls:
      - 'backgroundColor 与 gradient 只能选一个；两者切换用 withBackground(color:) / withBackground(gradient:)'
    related: ['`WAppBar`']
    teach: false
  - name: '`WNavBar` / `WNavController`'
    package: 'w_tools_ui'
    docsAnchor: 'wnavbar--wnavcontroller'
    section: '1. 页面骨架与导航'
    useFor: '底部 tab 栏；controller 只维护 currentIndex，由页面 State dispose'
    dontUseFor: '不要自己写 `BottomNavigationBar`'
    usage: |
      final nav = WNavController(length: 3);
      WNavBar(
        controller: nav,
        padding: const EdgeInsets.symmetric(horizontal: 8),
        onBeforeTap: (index) async => true, // 返回 false 阻止切换
        itemBuilder: (context, index, selected) => ...,
      );
      
      // 或者用默认 item（图标 + 文字）：
      WNavBar(
        controller: nav,
        destinations: const [
          WNavDestination(icon: Icons.home_outlined, selectedIcon: Icons.home, label: '首页'),
          WNavDestination(icon: Icons.explore_outlined, label: '发现'),
          WNavDestination(icon: Icons.person_outline, label: '我的'),
        ],
      );

      @override
      void dispose() {
        nav.dispose();
        super.dispose();
      }
    pitfalls:
      - 'onBeforeTap 返回 false 可以阻止切换；同步 / 异步都支持'
      - '默认 safeArea: true，会避开 home indicator；放进已包 SafeArea 的容器时传 safeArea: false'
      - 'itemBuilder 与 destinations 必须且只能提供一个；destinations 数量必须等于 controller.length'
      - '每项点击区域默认 >= 48（minItemHeight）；要更矮 / 更高时显式传 minItemHeight'
    related: ['`WNavDestination`']
    teach: false
  - name: '`WNavDestination`'
    package: 'w_tools_ui'
    docsAnchor: 'wnavbar--wnavcontroller'
    section: '1. 页面骨架与导航'
    useFor: 'WNavBar 默认项的图标 / 选中图标 / 文案'
    dontUseFor: '需要完全自定义项时用 `WNavBar.itemBuilder`'
    usage: |
      WNavDestination(icon: Icons.home_outlined, selectedIcon: Icons.home, label: '首页');
    related: ['`WNavBar`']
    teach: false
  - name: '`WStep`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: '步骤条（注册流程等）'
    dontUseFor: '背景/高度用外层 Container；多步骤注意横向空间'
    usage: |
      WStep(labels: const ['下单', '付款', '完成'], current: 2);
    pitfalls:
      - 'current 从 1 开始；越界 / 空 labels 会在 debug 断言'
      - 'WStep 是 const 组件；labels 由调用方保证不可变，组件不做复制'
    related: ['`WStepStyle`']
    teach: false
  - name: '`WStepStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: '步骤条颜色 / 尺寸 / 间距 / 标签样式'
    dontUseFor: '不要靠改 WStep 内部布局实现视觉；优先用 itemBuilder'
    usage: |
      WStep(
        labels: const ['下单', '付款'],
        current: 1,
        style: const WStepStyle(currentColor: Colors.indigo, itemSize: 32),
      )
    related: ['`WStep`']
    teach: false
  - name: '`WStepColors`'
    package: 'w_tools_ui'
    docsAnchor: 'wstep'
    section: '1. 页面骨架与导航'
    useFor: 'WStepStyle.resolve 返回的 completed / current / upcoming 颜色'
    dontUseFor: '不要自己按 Brightness 推颜色；让 WStepStyle.resolve 解析主题'
    usage: |
      final colors = style.resolve(Theme.of(context).colorScheme);
      colors.completed; colors.current; colors.upcoming;
    related: ['`WStepStyle`', '`WStep`']
    teach: false
  - name: '`WText` / `WTextVariant` / `WTextStyles`'
    package: 'w_tools_ui'
    docsAnchor: '3-wtext---文本组件'
    section: '2. 文本与图标'
    useFor: '语义文字样式、overrides、maxLines、textScaler'
    dontUseFor: '不要再用已移除的 `WTextConfig`，改用 `WTextStyles`'
    usage: |
      WText(text: '标题', variant: WTextVariant.title);
      WText(text: '正文', variant: WTextVariant.body, maxLines: 2, overflow: TextOverflow.ellipsis);
      WText(text: '价格', variant: WTextVariant.price, style: const TextStyle(fontFeatures: [FontFeature.tabularFigures()]));
      WText.rich(
        textSpan: TextSpan(
          text: '¥128',
          children: [TextSpan(text: ' 起', style: TextStyle(fontSize: 12))],
        ),
        variant: WTextVariant.price,
      );
      // 品牌样式装一次：ThemeData(...).withWTextStyles(WTextStyles.fromTextTheme(TextTheme))
    pitfalls:
      - '已移除 WTextConfig；样式统一 WTextStyles'
      - 'enum 只有 11 个 variant，不要自造'
      - '混合样式用 WText.rich，子 TextSpan 只写差异，不要重复 root 样式'
    aliases: ['WText.rich']
    related: ['`WTextStyles`']
    teach: true
  - name: '`WIconText`'
    package: 'w_tools_ui'
    docsAnchor: '22-wicontext---图标--文字'
    section: '2. 文本与图标'
    useFor: '图标 + 文字一行（垂直居中 / 光学补偿），替代 Row + Icon + Text'
    dontUseFor: '纯图标 / 需要按钮语义用 `WButton.filled(icon: ...)`；复杂多行内容用 `WButton.filled(content: ...)`'
    usage: |
      WIconText(icon: Icons.star, text: '收藏');
      WIconText(icon: Icons.location_on, text: '上海市', variant: WTextVariant.body);
      WIconText(icon: Icons.info_outline, text: '说明', style: TextStyle(fontSize: 13));
      WIconText(icon: Icons.star, text: '已收藏', color: Theme.of(context).colorScheme.primary);
      WIconText.custom(icon: SvgPicture.asset('assets/star.svg'), text: '收藏'); // 任意 Widget
    pitfalls:
      - '不要再用 Row + Icon + Text 手拼；中文行盒会让图标偏高 1.5~2.5px'
      - '间距用 gap；不要在外面再套 Padding 改图标与文字的距离'
      - '超长文本用 maxLines / overflow；组件不自动截断'
      - '需要按钮语义 / 键盘操作 / loading 时用 WButton'
      - 'SVG / 资源图用 WIconText.custom；ui 不依赖 flutter_svg，SVG 项目自行引入'
    related: ['`WText`', '`WButton`']
    teach: true
  - name: '`WImage`'
    package: 'w_tools_ui'
    docsAnchor: '4-wimage---图片组件'
    section: '2. 文本与图标'
    useFor: '图片组件（network / asset / file / base64 / provider；缓存、占位、重试）'
    dontUseFor: '不要裸用 `Image.network`'
    usage: |
      WImage(source: WImageSource.network(url));
      WImage(source: WImageSource.asset('assets/images/logo.png'));
      WImage(
        source: WImageSource.network(url),
        options: const WImageLoadOptions(memCacheWidth: 800, retryCount: 2),
      );
      WImage(
        source: WImageSource.network(url),
        slots: WImageSlots(
          errorWidgetBuilder: (context, data, error, retry) =>
              WImageErrorView(error: error, onRetry: retry),
        ),
      );
      // 必须给 width/height/aspectRatio，或由父级约束（SizedBox/Expanded/AspectRatio）
    pitfalls:
      - '旧 WImage.network/asset/data 已在 6.0 删除'
      - '没有 width/height/aspectRatio 时必须由父级约束（SizedBox/Expanded/AspectRatio）；否则 Row/Column/ListView 里加载前是 0 尺寸（空白）'
      - 'width + fitWidth 仍不会确定高度；aspectRatio 不能和固定 width/height 同时设置'
      - '空 source（空字符串 / 纯空白）走 placeholderBuilder，不是 error'
      - '12.0 删除了 WImageController 与 WImageSlots 的 showRetryButton / emptyBuilder / progressBuilder；手动重试用 errorWidgetBuilder 的 onRetry'
    related: ['`WImageSource`', '`WImageSlots`']
    teach: true
  - name: '`WImageSource`'
    package: 'w_tools_ui'
    docsAnchor: '4-wimage---图片组件'
    section: '2. 文本与图标'
    useFor: 'WImage 的来源：network / asset / file / base64 / provider'
    dontUseFor: '不要用已删除的 WImage.network / asset / file / data，也不要用 WImageSource.parse'
    usage: |
      WImageSource.network(url);
      WImageSource.network(url, headers: {'Authorization': token}, cacheKey: 'avatar');
      WImageSource.asset('assets/images/logo.png'); // 完整路径
      WImageSource.file(path);
      WImageSource.base64(raw);
      WImageSource.provider(MemoryImage(bytes));
      await WImageSource.asset('assets/images/logo.png').resolve(memCacheWidth: 240); // 预加载
    pitfalls:
      - 'asset(name) 要传完整资源路径；12.0 删除了 WAssets.imagePath 与 prefix 参数'
      - '旧 WImage.network/asset/file 已删除'
      - '来源类型由调用方显式选择；12.0 删除了 WImageSource.parse 的字符串猜测'
      - '预加载用 WImageSource.resolve，不要自己拼 AssetImage/CachedNetworkImageProvider'
    related: ['`WImage`']
    teach: true
  - name: '`WImageStyle`'
    package: 'w_tools_ui'
    docsAnchor: 'wimagestyle-配置'
    section: '2. 文本与图标'
    useFor: '图片视觉：尺寸 / fit / 圆角 / 边框 / 阴影 / aspectRatio / 语义'
    dontUseFor: '占位/错误 UI 用 `WImageSlots`，加载/重试用 `WImageLoadOptions`，不要混在 style 里'
    usage: |
      WImageStyle(
        width: 40,
        height: 40,
        borderRadius: BorderRadius.all(Radius.circular(20)),
      )
      WImageStyle.cover(aspectRatio: 16 / 9, radius: 12)
      WImageStyle(
        width: 120,
        height: 68,
        borderRadius: BorderRadius.circular(8),
        border: Border.all(color: Colors.black12),
        boxShadow: WShadows.card,
        semanticLabel: '封面',
      )
    pitfalls:
      - 'aspectRatio 不能与固定 width/height 同时传（debug 断言）；copyWith 设置 width/height 且未显式传 aspectRatio 时会自动清空比例'
      - '头像 / 缩略图直接用 width + height（+ borderRadius）；12.0 删除了 WImageStyle.avatar / thumbnail'
      - 'copyWith(null) 表示保留；清空可空字段用 withoutWidth / withoutBorderRadius 等 without* 方法'
    related: ['`WImage`', '`WImageLoadOptions`']
    teach: true
  - name: '`WImageLoadOptions`'
    package: 'w_tools_ui'
    docsAnchor: 'wimageloadoptions-配置'
    section: '2. 文本与图标'
    useFor: '图片加载行为：解码尺寸 / 重试 / gapless'
    dontUseFor: '视觉样式用 `WImageStyle`'
    usage: |
      const WImageLoadOptions(memCacheWidth: 480, memCacheHeight: 480, retryCount: 2)
      const WImageLoadOptions(gaplessPlayback: true)
    pitfalls:
      - 'retryCount 默认 0（不自动重试）；需要重试要显式设置'
      - 'copyWith(null) 表示保留；清空解码尺寸用 withoutMemCacheWidth / withoutMemCacheHeight'
      - '占位 / 错误 / 进度 / 重试 UI 用 `WImageSlots`，不要塞进 Options'
    related: ['`WImage`', '`WImageStyle`', '`WImageSlots`']
    teach: true
  - name: '`WButton`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: 'Material 按钮：filled / outlined / text 三个构造器，带 loading / 语义 / 尺寸'
    dontUseFor: '任意 child 点击用 `WPressable`；表单值选择用 `WFormButton`'
    usage: |
      WButton.filled(label: '保存', onTap: save);
      WButton.outlined(label: '取消', onTap: cancel);
      WButton.text(label: '查看更多', onTap: more);
      WButton.filled(label: '提交', loading: true, onTap: save);
      WButton.filled(icon: Icons.add, label: '新增', size: WButtonSize.small, onTap: add);
      WButton.filled(icon: Icons.favorite, semanticLabel: '收藏', tooltip: '收藏', isSelected: true, onTap: toggle);
      // 危险色是 style / 项目 AppButtons，不是构造器
      WButton.filled(
        style: FilledButton.styleFrom(
          backgroundColor: Theme.of(context).colorScheme.error,
          foregroundColor: Theme.of(context).colorScheme.onError,
        ),
        label: '删除',
        onTap: remove,
      );
    pitfalls:
      - '视觉走 Material ButtonStyle（FilledButton / OutlinedButton / TextButton），不要自己拿 DecoratedBox 拼'
      - 'style 只覆盖属性，不改变按钮类型；AppButtons.primary/danger 配 .filled，secondary 配 .outlined，text 配 .text'
      - '13.0 删除了无名 WButton(...)、WButtonVariant 与 WButtonTheme.danger；危险色用 style'
      - 'loading 时按钮自动不可点；不必再传 enabled: false'
      - 'content 与 label/icon 不能同时传；icon-only 要提供 semanticLabel'
      - 'toggle 按钮用 isSelected；纯图标按钮仍需 tooltip / semanticLabel'
      - 'tooltip 与 onLongPress 可以同时传：长按会触发回调并显示提示'
      - 'semanticLabel / semanticHint 与 loading 同时用：loading 文案会并入 label 与 liveRegion'
    related: ['`WPressable`', '`WButtonTheme`', '`WButtonSize`']
    teach: true
  - name: '`WButtonTheme`'
    package: 'w_tools_ui'
    docsAnchor: '2-wbutton---按钮组件'
    section: '3. 按钮与操作'
    useFor: '全站按钮三类型 ButtonStyle（filled / outlined / text），ThemeExtension'
    dontUseFor: '单个按钮覆盖用 `WButton.filled(style: ButtonStyle(...))`，不要改全局主题'
    usage: |
      ThemeData(
        colorScheme: scheme,
        extensions: [
          WButtonTheme(
            filled: FilledButton.styleFrom(backgroundColor: brand),
            outlined: OutlinedButton.styleFrom(foregroundColor: brand),
          ),
        ],
      )
    pitfalls:
      - '只覆盖需要的类型；缺省字段回退到 ColorScheme 派生值'
      - '13.0 删除了 danger 槽：危险色放项目 AppButtons / style，不要塞回主题'
      - '12.0 删除了 WButtonStyle / WButtonStyleSet，传 Material ButtonStyle'
    related: ['`WButton`']
    teach: false
  - name: '`WPressable`'
    package: 'w_tools_ui'
    docsAnchor: '21-wpressable---任意-child-点击'
    section: '3. 按钮与操作'
    useFor: '任意 child 的点击 + 基础效果（无 button 语义）'
    dontUseFor: '需要 button 语义 / 键盘焦点 / 最小点击区域时用 `WButton`'
    usage: |
      WPressable(onTap: open, child: card);
      WPressable(effect: WPressEffect.scale, pressedScale: 0.98, onLongPress: ..., child: card);
    pitfalls:
      - '不设置 Semantics.button，也不处理键盘焦点；需要时显式包 Semantics 或改用 WButton'
      - 'effect 默认 opacity；需要缩放用 WPressEffect.scale'
    related: ['`WButton`']
    teach: true
  - name: '`WActionRow` / `WSelectableRow`'
    package: 'w_tools_ui'
    docsAnchor: 'wactionrow--wselectablerow'
    section: '3. 按钮与操作'
    useFor: '横向滚动按钮行：`WActionRow` 无选中、`WSelectableRow` 单选高亮'
    dontUseFor: '旧的 `WRowButtons` 已在 5.0 删除；纯静态排列直接用 `Row`'
    usage: |
      WActionRow(
        spacing: 8,
        onScroll: (offset) { ... },
        children: [WButton.filled(...), WButton.filled(...)],
      );
      WSelectableRow(
        itemCount: 4,
        selectedIndex: index,
        onSelected: (i) => setState(() => index = i),
        builder: (context, i, selected) => ...,
      );
    related: ['`WButton`']
    teach: false
  - name: '`WBadge`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标数字 / 圆点'
    dontUseFor: '不要用于长文案；多字提示用 WText'
    usage: |
      WBadge(badgeContent: const Text('3'), child: const Icon(Icons.notifications));
      WBadge.count(count: 120, maxCount: 99, child: const Icon(Icons.notifications));
      WBadge.dot(child: const Icon(Icons.notifications));
      WBadge(position: const WBadgePosition.center(), badgeContent: const Text('NEW'), child: ...);
      WBadge(offset: const Offset(4, -4), badgeContent: const Text('3'), child: ...);
      WBadge(showBadge: false, badgeContent: const Text('hidden'), child: ...);
      WBadge(semanticLabel: '3 条未读', badgeContent: const Text('3'), child: ...);
    pitfalls:
      - 'badgeContent 为空时不渲染徽章（不报错）'
      - '数量角标用 WBadge.count（可传 maxCount 显示 maxCount+）；圆点用 WBadge.dot'
      - 'offset 是 position 之上的额外位移；默认 Offset.zero'
      - '需要读屏上下文时传 semanticLabel；提供后气泡内容不再单独朗读'
      - '默认背景 / 前景取 ColorScheme.error / onError；自定义用 style: WBadgeStyle(...)'
    aliases: ['WBadge.count', 'WBadge.dot']
    related: ['`WBadgeStyle`', '`WBadgePosition`']
    teach: false
  - name: '`WBadgeStyle`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标视觉：背景 / 前景 / 文字 / padding / 圆角 / 边框'
    dontUseFor: '不要在这里放位置；位置用 WBadgePosition'
    usage: |
      WBadge(
        style: const WBadgeStyle(backgroundColor: Colors.green, foregroundColor: Colors.white),
        badgeContent: const Text('NEW'),
        child: icon,
      )
    related: ['`WBadge`', '`WBadgePosition`']
    teach: false
  - name: '`WBadgePosition`'
    package: 'w_tools_ui'
    docsAnchor: '5-wbadge---徽章组件'
    section: '3. 按钮与操作'
    useFor: '角标位置：topEnd / center'
    dontUseFor: '不要用它做外部布局；它只控制角标相对 child 的位置'
    usage: |
      WBadge(position: const WBadgePosition.topEnd(top: 2, end: 2), child: ...);
      WBadge(position: const WBadgePosition.center(), child: ...);

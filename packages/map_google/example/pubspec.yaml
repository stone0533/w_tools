name: w_tools_map_example
description: "w_tools_map 真实场景示例：门店地图、列表选中、相机动画与关闭选中。"
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # 发布物里 example 必须能从 pub.dev 解析；本地开发用 pubspec_overrides.yaml 指到 workspace。
  w_tools_map: ^3.0.0
  w_tools_map_google:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
